<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <!-- single meta; applyTheme() (ui.js) syncs content to --bg for the ACTIVE app theme (not the system scheme) -->
  <meta name="theme-color" content="#030408" />
  <!-- the first paint is the splash's own ground, before any stylesheet arrives: a cream page showed for two frames between iOS's black
       launch and the lighthouse (Tom's recording 10/5). styles.css takes the background back to the theme's once it loads. -->
  <!-- THE FIRST PAINT WAITS FOR NOTHING (10/5): this is all the browser needs to draw the splash's ground. The two stylesheets used to sit
       here and block the first paint while the service worker revalidated them over the network; in that gap iOS faded the launch image
       into a blank white web view (two to four grey frames in Tom's recordings). They now load after the first frame (the loader at the
       end of the body), and the app's scripts wait for them, so nothing boots unstyled. -->
  <style id="pre-style">html { background: #030408; } #splash { position: fixed; inset: 0; z-index: 2000; background: #030408; } body > :not(#splash) { visibility: hidden; }</style>
  <link rel="preload" as="style" href="./fonts.css" />
  <link rel="preload" as="style" href="./styles.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- translucent so the home atmosphere reaches the top edge under the status bar; safe-area padding on the topbar keeps content clear of the notch -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- launch images (10/5): the splash's near-black ground as a still, one per iPhone screen size. iOS shows it from the tap on the icon until the
       page's first paint, in place of a blank web view (two grey frames on a warm relaunch). iOS reads these when the icon is added. -->

  <link rel="apple-touch-startup-image" href="./launch/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="./launch/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

  <link rel="apple-touch-startup-image" href="./launch/launch-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

  <title>Tripfluent</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preload" href="./fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/source-serif-4-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/source-serif-4-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/playfair-italic-500.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="splash"></div>
  <div class="topbar">
    <div class="stat streak"><span class="ic flame"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4-3 5.5-3 9a5 5 0 0 0 10 0c0-1.5-.5-2.7-1.3-3.8C17 9.5 15 10 15 8c0-2.2-1.4-4.6-3-6z"/></svg></span><span id="stat-streak">0</span></div>
    <div class="topbar-brand" id="topbar-brand"></div>
    <button class="lang-flag-top" id="lang-flag" aria-label="Switch destination"></button>
  </div>

  <main id="app"></main>
  <nav id="tabbar"></nav>
  <div class="toast" id="toast"></div>

  <!-- THE LOADER: first frame, then the stylesheets, then the scripts in their order (content packs, engine, screens, app.js last).
       Scripts added this way with async=false run in the order they were added, exactly as the old script tags did. -->
  <script>
  (function () {
    var css = ["./fonts.css", "./styles.css"];
    var js = ["./config.js", "./curriculum.js", "./content_mx.js", "./messages.js", "./state.js", "./engine.js", "./audio.js", "./ui.js", "./srs.js", "./weights.js", "./scoring.js", "./tiers.js", "./screen-onboarding.js", "./charts.js", "./screen-home.js", "./screen-learn.js", "./screen-quests.js", "./screen-phrasebook.js", "./screen-progress.js", "./screen-settings.js", "./lesson.js", "./cloud.js", "./accounts.js", "./push.js", "./trips.js", "./nav.js", "./app.js"];
    var started = false;
    function scripts() {
      if (started) return; started = true;
      var pre = document.getElementById("pre-style"); if (pre) pre.textContent = "html { background: #030408; }";   // the stylesheet owns everything else now
      js.forEach(function (src) { var el = document.createElement("script"); el.src = src; el.async = false; document.body.appendChild(el); });
    }
    function styles() {
      var left = css.length;
      css.forEach(function (href) {
        var l = document.createElement("link"); l.rel = "stylesheet"; l.href = href;
        l.onload = l.onerror = function () { if (--left === 0) scripts(); };
        document.head.appendChild(l);
      });
      setTimeout(scripts, 8000);   // never strand the app behind a stylesheet that will not answer
    }
    var go = function () { setTimeout(styles, 0); };
    if (window.requestAnimationFrame) requestAnimationFrame(go); else go();   // after the first frame has been drawn
    setTimeout(function () { if (!document.querySelector('link[rel="stylesheet"]')) styles(); }, 400);   // a hidden tab draws no frames: do not wait for one
  })();
  </script>
</body>
</html>
