 { background: none; border: 0; border-bottom: 1.5px dotted var(--text-dim); border-radius: 0; padding: 0 0 2px;\n  font-family: var(--font-display); font-size: 17px; font-weight: 500; line-height: 1.4; color: var(--text); cursor: pointer; user-select: none;\n  transition: color var(--transition), border-color var(--transition); }\n.corr-chunk[data-i]:active, .corr-chunk.playing { color: var(--accent-2); border-bottom-color: var(--accent-2); }\n.corr-chunk.error { background: color-mix(in srgb, var(--accent) 14%, var(--bg-card)); border: 1px solid var(--accent-2);\n  border-radius: var(--radius-sm); padding: 7px 11px; line-height: 1.25; }   /* gold = attend here (error locus); green retired from chunk marking */\n.corr-chunk.error.playing { color: var(--text); }\n.corr-chunk.plain { cursor: default; border-bottom: 0; padding: 0; }   /* whole-phrase (non-chunked) correction: not tappable, no hint underline */\n.corr-audio { width: 40px; height: 40px; min-width: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--border);\n  background: var(--bg-card); color: var(--accent-2); box-shadow: var(--shadow); display: inline-flex; align-items: center; justify-content: center;\n  cursor: pointer; transition: transform var(--transition), box-shadow var(--transition); }\n.corr-audio:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.corr-trans { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }\n.corr-anchor { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }\n.corr-anchor .lead { color: var(--accent-2); font-weight: 500; }\n.corr-continue { width: 100%; }\n.corr-pop { position: absolute; background: var(--primary); color: #fff; font-size: 12.5px; padding: 7px 11px; border-radius: var(--radius-sm);\n  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--transition), transform var(--transition); white-space: nowrap; z-index: 10; }\n.corr-pop.show { opacity: 1; transform: translateY(0); }\n\n/* \u00a73.3 confirm sheet body + quiet destructive ghost button */\n.confirm-body { font-size: 15px; color: var(--text-dim); line-height: 1.5; margin: -4px 0 16px; }\n.confirm-ghost { width: 100%; background: none; border: none; box-shadow: none; color: var(--text-dim); font-weight: 800; font-size: 15px; padding: 13px; margin-top: 4px; cursor: pointer; }\n.sheet .btn + .btn { margin-top: 10px; }   /* stacked buttons in a sheet never touch (the quit sheet's \"Turn sound back on\" sat on \"Keep going\", Tom 9/22) */\n.confirm-ghost.danger { color: var(--red); }\n.sheet-sub { font-size: 13px; font-weight: 700; color: var(--secondary); text-transform: capitalize; margin: -8px 0 12px; }\n.drivers { display: flex; flex-direction: column; gap: 8px; }\n.driver { background: var(--bg-elevated); border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 15px; }\n/* \u00a77.1 role line + \u00a77.3 divergence narration in the score detail sheet */\n.sheet-role { font-size: 13px; color: var(--text-dim); line-height: 1.45; margin: 0 0 14px; }\n.sheet-diverge { margin-top: 12px; background: var(--bg-card); border: 1px solid var(--accent-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }\n\n/* \u00a77.2 daily trend sparkline in the score detail sheet */\n.sheet-trend { margin: 16px 0 2px; }\n.trend-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }\n.trend-title { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }\n.trend-delta { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--text-dim); }\n.trend-delta.up { color: var(--green); }\n.trend-delta.down { color: var(--red); }\n.trend-svg { width: 100%; height: auto; display: block; }\n.trend-area { fill: color-mix(in srgb, var(--tc) 15%, transparent); stroke: none; }\n.trend-line { fill: none; stroke: var(--tc); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }\n.trend-dot { fill: var(--tc); }\n\n/* profile */\n.profile-status { text-align: center; padding: 8px 0 22px; }\n.tier-name { font-family: var(--font-display); font-weight: 800; font-size: 28px; }\n.tier-sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; line-height: 1.45; max-width: 340px; margin-left: auto; margin-right: auto; }\n/* \u00a75.2 trip archive \u2014 permanent trophies on the profile */\n.archive-row { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border);\n  border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; }\n.arch-dest { font-weight: 800; flex: 1; }\n.arch-meta { color: var(--text-dim); font-size: 12px; }\n.arch-score { font-family: var(--font-display); font-weight: 800; font-size: 18px; }\n.arch-score.band-top { color: var(--green); } .arch-score.band-good { color: var(--secondary); }\n.arch-score.band-mid { color: var(--accent-2); } .arch-score.band-low { color: var(--text-dim); }\n/* \u00a72.3 tier-up moment + \u00a74.4 migration card \u2014 quiet full-screen, typography carries it */\n.tierup-wrap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px;\n  background: color-mix(in srgb, var(--bg) 88%, transparent); opacity: 0; transition: opacity .35s; }\n.tierup-wrap.show { opacity: 1; }\n.tierup { text-align: center; max-width: 380px; transform: translateY(10px); transition: transform .45s cubic-bezier(.3,.7,.3,1); }\n.tierup-wrap.show .tierup { transform: none; }\n.tierup-kicker { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-2); margin-bottom: 14px; }\n.tierup-name { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.05; margin-bottom: 16px; }\n.tierup-name.band-top { color: var(--green); } .tierup-name.band-good { color: var(--secondary); }\n.tierup-name.band-mid { color: var(--accent-2); } .tierup-name.band-low { color: var(--text-dim); }\n.tierup-body { color: var(--text-dim); font-size: 15px; line-height: 1.5; }\n\n.complete .stars-n { color: var(--accent-2); }\n.complete .pct { font-size: 20px; color: var(--text-dim); }\n.complete .up { color: var(--green); font-weight: 800; }\n/* \u00a78.4 session-complete score result line (\"+3 Readiness \u00b7 2 phrases restored\") \u2014 a result, not a reward drip */\n.session-delta { margin: 4px 0 16px; font-weight: 800; font-size: 14px; color: var(--accent-2); }\n\n/* ============ LEARN TAB (design/learn-tab.html) \u2014 Journey | Topics | Phrases ============ */\n.learn-head { padding: 0 4px; margin-bottom: 14px; }\n.learn-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 12px; }\n.segs { display: flex; background: var(--bg-elevated); border-radius: 12px; padding: 3px; }\n.seg { flex: 1; text-align: center; font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--text-dim);\n  padding: 8px 0; border: none; background: none; border-radius: 10px; cursor: pointer;\n  transition: background var(--transition), color var(--transition), box-shadow var(--transition); }\n.seg.active { background: var(--bg-card); color: var(--text); box-shadow: 0 1px 2px rgba(28,39,94,.12); }\n.learn-scroll { padding: 2px 0 12px; }\n/* Journey: chaptered spine. Progression stays whisper-level \u2014 \"N of M\", no stage bars. */\n.chapter { margin-bottom: 26px; }\n.chapter.locked { opacity: .55; }\n.chap-head { margin-bottom: 12px; }\n.chap-kicker { font-family: var(--font-display); font-size: 10.5px; font-weight: 600; letter-spacing: .07em; color: var(--accent-2); margin-bottom: 3px; }\n.chap-row { display: flex; align-items: baseline; justify-content: space-between; }\n.chap-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); }\n.chap-whisper { font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--text-dim); }\n.chap-blurb { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }\n.learn .lesson { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border);\n  border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow);\n  transition: transform var(--transition), box-shadow var(--transition); }\n.learn .lesson:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.learn .lesson.next { border-color: var(--accent-2); }\n.caret-new { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--bg-elevated);\n  display: flex; align-items: center; justify-content: center; color: var(--text-dim); }\n.lmain { flex: 1; min-width: 0; }\n.lname-row { display: flex; align-items: center; gap: 7px; }\n.lname { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.next-tag { font-family: var(--font-display); font-size: 9.5px; font-weight: 600; letter-spacing: .05em; color: var(--accent-2);\n  border: 1px solid var(--accent-2); border-radius: 9px; padding: 1.5px 7px; white-space: nowrap; }\n.bonus-tag { font-family: var(--font-display); font-size: 9.5px; font-weight: 600; letter-spacing: .05em; color: var(--text-dim);\n  border: 1px solid var(--border); border-radius: 9px; padding: 1.5px 7px; white-space: nowrap; }\n.lbeat { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.lbeat.wrap { white-space: normal; overflow: visible; text-overflow: clip; }   /* the session's one line wraps in full (the old truncation is what Tom disliked) */\n.peek-label { margin: 0 0 6px -12px; }   /* the labels step out to the card's edge, a level above the words (option C, Tom 9/24) */   /* drawer option 1 (Tom 9/24): ABOUT THIS SESSION and THE WORDS in the whisper face */\n.peek-line { font-size: 14.5px; font-weight: 500; color: var(--text); line-height: 1.45; margin: 2px 0 12px; }   /* the line, plain (option 1 replaced the italic, Tom 9/24) */\n.lmeta { font-size: 11px; color: var(--text-dim); margin-top: 3px; }\n.lmeta .fading { color: var(--accent-2); font-weight: 500; }\n.learn .chev { color: var(--text-dim); display: flex; }\n/* soft gate: invitation, never barred language */\n.lock-hint { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); padding: 2px 2px 0; }\n.lock-hint svg { min-width: 12px; }\n/* Topics: a coverage row IS the drill entry */\n.topics-intro { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 14px; }\n.topic { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border);\n  border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow);\n  transition: transform var(--transition), box-shadow var(--transition); }\n.topic:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.tmain { flex: 1; min-width: 0; }\n.trow { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }\n.tname { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text); }\n.tpct { font-family: var(--font-display); font-size: 13px; font-weight: 600; }\n.tbar { height: 5px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; }\n.tbar > i { display: block; height: 100%; border-radius: 3px; }\n.tsub { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }\n.tsub .fading { color: var(--accent-2); font-weight: 500; }\n.topic.t-strong .tpct { color: var(--secondary); } .topic.t-strong .tbar > i { background: var(--secondary); }\n.topic.t-fair   .tpct { color: var(--accent-2); }  .topic.t-fair   .tbar > i { background: var(--accent-2); }\n.topic.t-low    .tpct { color: var(--text-dim); }  .topic.t-low    .tbar > i { background: var(--text-dim); }\n/* dark: the translucent --bg-card fill sits at the track's own brightness, so the active segment\n   vanished. White-alpha steps make it read raised (Tom legibility fix 2026-07-19; artifact synced).\n   Dual-dark-block rule: both blocks, always. */\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) .segs { background: rgba(255,255,255,0.07); }\n  :root:not([data-theme=\"light\"]) .seg.active { background: rgba(255,255,255,0.16); box-shadow: none; }\n}\n:root[data-theme=\"dark\"] .segs { background: rgba(255,255,255,0.07); }\n:root[data-theme=\"dark\"] .seg.active { background: rgba(255,255,255,0.16); box-shadow: none; }\n\n/* ============ \u00a73.5 RESOLUTION FRAME (design/resolution-frame.html) ============\n   One resolution language: correct answers mature the page in place. Fusion, sweep, materialization;\n   sheets stay reserved for the miss. The old correct-feedback wash survives as the base layer. */\n.build-answer { transition: gap 450ms cubic-bezier(.2,.7,.3,1); position: relative; }\n.build-answer .word { transition: background 450ms, border-color 450ms, box-shadow 450ms, padding 450ms cubic-bezier(.2,.7,.3,1), font-size 450ms cubic-bezier(.2,.7,.3,1); }\n.build-answer.fused { gap: 5px; border-bottom-color: transparent; }\n/* the fused sentence is a centerpiece surface: words mature to the es-reveal scale\n   (22px display 600), not tile scale \u2014 same size as every other exercise's resolved es\n   (Tom, 2026-07-20; canvas artifacts still show tile-size fused lines, next re-issue adopts) */\n.build-answer.fused .word, .build-answer.fused .slot { background: transparent; border-color: transparent; box-shadow: none; padding-left: 0; padding-right: 0; font-weight: 600; color: var(--text); font-size: 22px; font-family: var(--font-display); }\n.build-answer .sweep { position: absolute; left: 0; bottom: 6px; height: 2.5px; width: 100%; background: var(--green); border-radius: 2px;\n  transform: scaleX(0); transform-origin: left center; }\n.build-answer.fused .sweep { animation: res-sweep 400ms cubic-bezier(.2,.7,.3,1) 350ms forwards; }\n@keyframes res-sweep { to { transform: scaleX(1); } }\n.bank { transition: opacity 450ms; }\n.bank.recede { opacity: .28; pointer-events: none; }\n/* materialization block: es reveal + en + audio grow in around the achievement object */\n/* Sprint 2 ruling 1 [tune]s: no 600ms hold \u2014 the frame (and its Continue) is live from first\n   paint; the reveal beats stagger in at ~150ms steps behind it instead */\n.res-grown { opacity: 0; transform: translateY(5px); transition: opacity 300ms cubic-bezier(.2,.7,.3,1), transform 300ms cubic-bezier(.2,.7,.3,1); margin-top: 16px; }\n.res-grown.show { opacity: 1; transform: none; }\n.res-grown .res-en, .res-grown .res-audio, .res-grown .res-note { opacity: 0; transition: opacity 300ms cubic-bezier(.2,.7,.3,1); }\n.res-grown.show .res-en { opacity: 1; transition-delay: 150ms; }\n.res-grown.show .res-audio { opacity: 1; transition-delay: 300ms; }\n.res-grown.show .res-note { opacity: 1; transition-delay: 450ms; }\n.es-reveal { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--text); position: relative; display: inline-block; margin-bottom: 4px; }\n.es-reveal .sweep2 { position: absolute; left: 0; right: 0; bottom: -6px; height: 2.5px; background: var(--green); border-radius: 2px;\n  transform: scaleX(0); transform-origin: left center; }\n.res-grown.show .sweep2 { animation: res-sweep 350ms cubic-bezier(.2,.7,.3,1) 250ms forwards; }\n/* the grown is a footnote zone (\u00a73.7, 2026-07-20): the shared 13px line, every exercise.\n   13.5 was the r7 frame's value; the batch ratified 13 \u2014 resolution-frame.html canvas\n   should pick this up on its next re-issue (do not revert). */\n.res-en { font-size: 13px; color: var(--text-dim); margin: 10px 0 14px; }\n.res-audio-row { display: flex; align-items: center; gap: 10px; }\n.res-audio-row .audio-hint { font-size: 12px; color: var(--text-dim); }\n.res-yours { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--green); margin-bottom: 8px; }\n.res-note { font-size: 12.5px; color: var(--text-dim); margin-top: 14px; }\n.res-cont { margin-top: 18px; }\n/* RESTORED kicker (r7): the fading vocabulary tied to the word \u2014 the mini ring appears as the gold\n   low arc the learner knows from fading marks, then climbs and turns strong-blue on materialization */\n.res-kick { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }\n.res-kick .res-restored { margin-bottom: 0; }\n.kfg { stroke: var(--accent-2); stroke-dasharray: 40.8; stroke-dashoffset: 26;\n  transition: stroke-dashoffset 600ms cubic-bezier(.2,.7,.3,1) 350ms, stroke 600ms cubic-bezier(.2,.7,.3,1) 350ms; }\n.res-grown.show .kfg { stroke-dashoffset: 9; stroke: var(--secondary); }\n@media (prefers-reduced-motion: reduce) { .kfg { transition: none; } }\n/* per-item strength ring in the top row + the \"Stronger\" whisper */\n.q-sring { width: 26px; height: 26px; flex: none; display: inline-flex; }\n.q-sring .sr-bg { fill: none; stroke: var(--ring-track, var(--bg-elevated)); stroke-width: 3; }\n.q-sring .sr-fg { fill: none; stroke: var(--secondary); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 500ms cubic-bezier(.2,.7,.3,1); }\n.stick { position: absolute; top: 52px; right: 16px; font-family: var(--font-display); font-size: 11px; font-weight: 600;\n  color: var(--green); opacity: 0; transform: translateY(3px); transition: opacity 300ms, transform 300ms; pointer-events: none; }\n.stick.show { opacity: 1; transform: none; }\n.runner { position: relative; }\n@media (prefers-reduced-motion: reduce) {\n  .build-answer, .build-answer .word, .res-grown, .stick, .bank,\n  .res-grown .res-en, .res-grown .res-audio, .res-grown .res-note { tr wrap; }\n.lslot { display: inline-block; text-align: center; border-bottom: 2px solid color-mix(in srgb, var(--text-dim) 45%, transparent);\n  color: var(--text-dim); min-width: 0.7em; margin: 0 1px; transition: border-color var(--transition), color var(--transition); }\n.lslot .dashes { color: var(--text-dim); letter-spacing: 0; font-weight: 500; opacity: 0.6; }\n.lslot.next { border-bottom-color: var(--accent); border-bottom-width: 3px; }\n.lslot.filled { border-bottom-color: transparent; color: var(--text); position: relative; }\n.lslot.filled::after { content: \"\"; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--green);\n  border-radius: 2px; transform: scaleX(0); transform-origin: left center; animation: res-sweep 300ms cubic-bezier(.2,.7,.3,1) 80ms forwards; }\n.lslot.wrongflash { border-bottom-color: var(--red); }\n.fill-gloss { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }\n.keytray { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 14px; padding-bottom: 4px; transition: opacity 300ms; }\n.keytray.recede { opacity: 0.28; pointer-events: none; }\n.keytray .keytile { min-width: 46px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius-sm);\n  background: var(--bg-card); border: 1px solid var(--border);\n  font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text); cursor: pointer;\n  box-shadow: var(--shadow); transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition); }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .keytray .keytile {\n  background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); } }\n:root[data-theme=\"dark\"] .keytray .keytile { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); }\n.keytray .keytile:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.keytray .keytile.spent { opacity: 0.28; pointer-events: none; box-shadow: none; }\n.keytray .keytile.shake { animation: kshake 300ms ease; border-color: var(--red); }\n@keyframes kshake { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }\n.kbd-affordance { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 12px 0 4px;\n  font-size: 12.5px; color: var(--text-dim); justify-content: center; transition: opacity 300ms; }\n.kbd-affordance.recede { opacity: 0.28; }\n.kbd-affordance svg { color: var(--accent-2); }\n.fill-hidden-input { position: absolute; opacity: 0; pointer-events: none; left: -9999px; }\n@media (prefers-reduced-motion: reduce) {\n  .lslot.filled::after { animation: none; transform: scaleX(1); }\n  .keytray .keytile.shake { animation: none; }\n}\n\n/* ===================== THE LISTENING FAMILY + THE FIELD =====================\n   design/listening-family.html (2026-07-25). The facet landscape is the exercise\n   ground app-wide: ONE FIELD, ONE VOLUME. Light lives IN the triangles and follows\n   the LOCAL CLOCK in both themes (daylight window evaluated at session start,\n   never mid-session). Facets never compete with words; collisions get local fixes. */\n.runner { position: relative; }\n.facet-bg { position: absolute; top: 0; left: 0; right: 0; height: 555px; pointer-events: none; z-index: 0; }\n/* ===== THE BOTTOM LANDSCAPE (bottom-landscape.html r11): the one field reaches its bottom shore ===== */\n.runner { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; }   /* the runner claims the full screen so the range grounds at the TRUE bottom (the artifact's fixed frame implied it) */\n.facet-bg { bottom: 0; height: auto; }                 /* the node grows full-bleed; top geometry untouched */\n.facet-bg svg:first-child { height: 555px; }           /* the shipped 74 facets keep their exact box */\n.facet-bg svg.range { position: absolute; bottom: 0; left: 0; width: 100%; height: 33%; }  /* one third [tune], Tom: higher + stacked */\n.facet-bg .range .rf  { fill: var(--secondary); opacity: 0.07; }\n.facet-bg .range .rfs { fill: var(--primary);   opacity: 0.05; }\n.facet-bg .range .rf2 { fill: var(--secondary); opacity: 0.11; }\n.facet-bg .range .rn2 { fill: var(--primary);   opacity: 0.09; }\n.facet-bg .range .rn  { fill: var(--primary);   opacity: 0.13; }\n.facet-bg .range .rns { fill: var(--accent-2);  opacity: 0.06; }\n.facet-bg .range .rt  { fill: var(--primary);   opacity: 0.09; }\n.facet-bg .range .rtb { fill: var(--primary);   opacity: 0.045; }\n/* dark overrides, BOTH blocks (dual-dark law - the handoff's data-theme rules get their\n   prefers-color-scheme twins so system-dark users see the stamped values too) */\n:root[data-theme=\"dark\"] .facet-bg .range .rf  { opacity: 0.10; }\n:root[data-theme=\"dark\"] .facet-bg .range .rfs { opacity: 0.07; }\n:root[data-theme=\"dark\"] .facet-bg .range .rf2 { opacity: 0.14; }\n:root[data-theme=\"dark\"] .facet-bg .range .rn  { opacity: 0.17; }\n:root[data-theme=\"dark\"] .facet-bg .range .rns { opacity: 0.08; }\n:root[data-theme=\"dark\"] .facet-bg .range .rn2 { opacity: 0.12; }\n:root[data-theme=\"dark\"] .facet-bg .range .rt  { opacity: 0.18; }\n:root[data-theme=\"dark\"] .facet-bg .range .rtb { opacity: 0.10; }\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rf  { opacity: 0.10; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rfs { opacity: 0.07; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rf2 { opacity: 0.14; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rn  { opacity: 0.17; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rns { opacity: 0.08; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rn2 { opacity: 0.12; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rt  { opacity: 0.18; }\n  :root:not([data-theme=\"light\"]) .facet-bg .range .rtb { opacity: 0.10; }\n}\n.facet-bg svg { width: 100%; height: 100%; display: block; }\n.facet-bg.no-light .lightgroup { display: none; }   /* night: the app's light rests in the instruments */\n.runner > *:not(.facet-bg) { position: relative; z-index: 1; }\n\n/* Sound is the centerpiece: hero SIZE VARIANT of the canonical AudioControl\n   (64px, same anatomy, scaled never restyled) centered on the listening stage */\n.listen-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 0 22px; }\n.listen-stage .ac-speaker { width: 64px; height: 64px; min-width: 64px; }\n.listen-stage .ac-speaker .ac-glyph { width: 24px; height: 24px; }\n.listen-stage .ac-speaker .ac-bars { height: 22px; }\n.listen-stage .ac-speaker .ac-bars span { width: 3.5px; }\n.listen-stage .hint { font-size: 12.5px; color: var(--text-dim); }\n\n/* The ear never loses the answer: the played-line reveals the played es at every\n   listening resolution (20/600 display + replayable 36px control), correct or missed */\n.played-line { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--text);\n  display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; opacity: 0; transform: translateY(4px);\n  transition: opacity 280ms cubic-bezier(.2,.7,.3,1), transform 280ms cubic-bezier(.2,.7,.3,1); }\n.played-line.show { opacity: 1; transform: none; }\n.played-line .ac-speaker { width: 36px; height: 36px; min-width: 36px; }\n.played-line .ac-speaker .ac-glyph { width: 15px; height: 15px; }\n\n/* Escapes are whispers in the exit zone (above Continue); persistence is system.\n   (.whisper-escape, not the artifact's .linkbtn.whisper: the app's .linkbtn is a\n   different, older component \u2014 grep-the-class-name law) */\n.whisper-escape { display: block; width: 100%; border: none; background: none; font-family: var(--font-display);\n  font-size: 12.5px; font-weight: 500; color: var(--text-dim); text-decoration: underline;\n  text-decoration-color: color-mix(in srgb, var(--text-dim) 40%, transparent);\n  text-underline-offset: 3px; cursor: pointer; padding: 6px; margin-bottom: 10px; }\n.swapnote { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 0;\n  font-size: 13px; color: var(--text-dim); text-align: center; }\n.swapnote .big { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text); }\n\n/* wrong-then-release (listening resolutions): the chosen wrong option is marked,\n   then released to the uniform dim settle \u2014 never left glowing */\n@media (prefers-reduced-motion: reduce) { .played-line { transition: none; } }\n\n/* ===== OPAQUE-OVER-THE-FIELD (end of sheet: cascade-proof, per the artifact) =====\n   Over the field, every functional surface is opaque \u2014 controls, inputs, choices,\n   tiles, AND the unfilled portions of instruments. Only the decoration is see-through. */\n.ac-speaker, .ac-speed, .choice, .word, .keytray .keytile, .pcard { background: var(--solid-card); }\n#qbody .text-input, .runner .text-input { background: var(--solid-card); }\n.pbar { background: var(--solid-track); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text-dim) 14%, transparent); }\n#q-sring .sr-bg { stroke: var(--solid-track); }\n.choice.correct { background: color-mix(in srgb, var(--green) 15%, var(--solid-card)); }\n.choice.wrong { background: color-mix(in srgb, var(--red) 15%, var(--solid-card)); }\n#qbody.qcorrect .text-input { background-color: color-mix(in srgb, var(--green) 8%, var(--solid-card)); }\n/* dark-theme functional surfaces go solid over the field too (these outrank the tail\n   list above by specificity, so they get their own dual-block override). The matched\n   pcard's recede reads through opacity, never a see-through ground. */\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .keytray .keytile,\n  :root:not([data-theme=\"light\"]) .pcard.matched, :root:not([data-theme=\"light\"]) .pcard.settled { background: var(--solid-card); } }\n:root[data-theme=\"dark\"] .keytray .keytile,\n:root[data-theme=\"dark\"] .pcard.matched, :root[data-theme=\"dark\"] .pcard.settled { background: var(--solid-card); }\n/* sheetless sound choice (2026-07-25): the correct option carries the reveal \u2014 green wash\n   over the solid ground, and it stays replayable after the settle */\n.sc-card.settled { background: color-mix(in srgb, var(--green) 12%, var(--solid-card)); border-color: var(--green); cursor: pointer; }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .sc-card.settled { background: color-mix(in srgb, var(--green) 12%, var(--solid-card)); } }\n:root[data-theme=\"dark\"] .sc-card.settled { background: color-mix(in srgb, var(--green) 12%, var(--solid-card)); }\n\n/* ===== THE TEST LAB (Tom 2026-08-05): fabricate any user; never confusable with real progress ===== */\n.lab-card { margin-top: 22px; padding: 16px; border: 1.5px dashed var(--border); border-radius: var(--radius); }\n.lab-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; margin: 10px 0 4px; color: var(--text); font-weight: 500; }\n.lab-row input[type=\"number\"] { width: 78px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 7px 9px; font-size: 14px; font-family: var(--font-display); text-align: center; }\n.lab-slider { width: 100%; accent-color: var(--accent); margin: 2px 0 6px; }\n.lab-val { color: var(--text-dim); font-size: 13px; }\n.lab-btns { display: flex; gap: 10px; margin-top: 14px; }\n.lab-btns .btn { flex: 1; }\n.dial-delta.empty { visibility: hidden; }\n.lab-telem { font-size: 12px; color: var(--text-dim); line-height: 1.7; padding: 8px 10px; background: var(--bg-card); border-radius: 8px; }\n.lab-select { flex: 1.4; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px; font-size: 13px; font-family: var(--font-display); min-width: 0; }\n.lab-active { background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid var(--accent); color: var(--accent-2); font-size: 12px; font-weight: 700; border-radius: 9px; padding: 6px 10px; margin: 10px 0 2px; letter-spacing: .4px; }\n#lab-chip { display: inline-flex; align-items: center; margin-left: 8px;\n  background: var(--accent); color: #221c04; font: 700 9.5px/1 var(--font-display); letter-spacing: 1px; padding: 4px 8px; border-radius: 99px; pointer-events: none; }\n\n/* ===== THE RETURN DOOR r5.5 (design/return-door.html, stamped 2026-08-12) =====\n   The scene wears home's atmo blend verbatim; the badge wears the logo's faces; the frame\n   is the pedestal. Deltas minted for the surface: door-photo/badge/frame/head/fade/rec +\n   st-hold/st-slip/st-fade. Runner padding is 18px, so full-bleed pulls -18px (artifact's\n   -24px was its own phone padding). */\n.door-photo { position: relative; margin: 6px -18px 2px; height: 210px; }\n.door-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block;\n  filter: saturate(.72) brightness(.82) contrast(.95);\n  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 26%, rgba(0,0,0,.5) 58%, transparent 96%);\n          mask-image: linear-gradient(180deg, #000 0%, #000 26%, rgba(0,0,0,.5) 58%, transparent 96%); }\n.door-photo::after { content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 34%); }\n.door-badge { position: absolute; top: 12px; left: 16px; z-index: 1; font-size: 15px; letter-spacing: -0.01em;\n  text-shadow: 0 1px 8px rgba(0,0,0,.5); }\n.door-badge::before { content: \"\"; position: absolute; inset: -14px -26px -16px -20px; z-index: -1; border-radius: 50%;\n  background: radial-gradient(closest-side, rgba(0,0,0,.38) 0%, rgba(0,0,0,.2) 55%, transparent 100%); }\n.door-badge .t1 { font-family: var(--font-display); font-weight: 800; color: #c8d2f5; }\n.door-badge .t2 { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; color: #7aa6db; }\n.door-badge .wordmark { --wordmark-1: #c8d2f5; --wordmark-2: #7aa6db; display: block; }\n.door-frame { margin: -26px 0 12px; position: relative; }\n.door-frame::before { content: \"\"; position: absolute; inset: -16px -30px -12px -30px; z-index: -1;\n  background: radial-gradient(closest-side, var(--bg) 45%, color-mix(in srgb, var(--bg) 60%, transparent) 75%, transparent 100%); }\n.door-frame .frame-mount { position: relative; }\n.door-title { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); position: relative; }\n.door-head { font-family: var(--font-display); font-size: 21px; font-weight: 500; line-height: 1.35; color: var(--text); margin-bottom: 10px; }\n.st-hold { color: var(--green); } .st-slip { color: var(--accent-2); } .st-fade { color: var(--text-dim); }\n.door-fade .st-fade { color: color-mix(in srgb, var(--text) 70%, var(--text-dim)); }\n.door-fade { font-size: 12.5px; color: var(--text-dim); margin: 2px 0 0; }\n.door-rec { font-size: 11.5px; color: var(--text-dim); opacity: .7; margin: 3px 0 4px; }\n\n/* diegetic cue lines are sentence case (2026-08-20): caps are for chrome, not story */\n.cue-label .cue-narr { text-transform: none; letter-spacing: 0; }\n\n/* ===== THE SCENES (scene-poc.html r15, stamped 2026-08-19) ===== */\n.scene-line { font-family: var(--font-display); font-size: 17px; font-weight: 500; line-height: 1.45;\n  color: var(--text); margin: 12px 0 16px; position: relative; }\n.scene-line .sl { display: block; margin-bottom: 8px; }\n.scene-line .sl:last-child { margin-bottom: 0; }\n.scene-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 6px 0 2px; }\n.scene-sub { font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.06em; margin-bottom: 14px; }\n.scene-art { display: block; width: 180px; height: auto; margin: 26px auto 8px; color: var(--text); opacity: 0.8; }\n.scene-art-lead { width: 262px; margin: 10px auto 6px; }\nimg.scene-art { width: 286px; }\n/* THE SCENE DOOR r24 (stamped FINAL 2026-08-22; the framed-photo window is graveyarded):\n   silver cap line -> SOLID full-bleed photo fading at its BOTTOM -> scene name bottom-left\n   in the logo faces -> SCENE: [PLACE] \u00b7 [TIME] -> two-line verse -> one CTA. Scoped under\n   .scene-door: the return door keeps its own .door-photo grammar. */\n.scene-door .door-photo { position: relative; margin: 6px -18px 2px; height: 248px; }\n.scene-door .door-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 58%; display: block; filter: none;\n  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 58%, rgba(0,0,0,.45) 82%, transparent 98%);\n          mask-image: linear-gradient(180deg, #000 0%, #000 58%, rgba(0,0,0,.45) 82%, transparent 98%); }\n.scene-door .door-photo::after { content: none; }\n.scene-door .door-photo::before { content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 2.25px; z-index: 2;\n  background: linear-gradient(90deg, rgba(120,126,140,.25), #d9dde6 28%, #f4f6fa 50%, #d9dde6 72%, rgba(120,126,140,.25));\n  box-shadow: 0 1px 2px rgba(0,0,0,.35); }\n.door-name { position: absolute; left: 24px; bottom: 10px; z-index: 1; font-family: var(--font-display);\n  font-size: 25px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }\n.door-name .n2 { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; }\n.door-name .n1 { color: #1c275e; }\n.door-name .n2 { color: #4a7fc1; }\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) .door-name .n1 { color: #c8d2f5; }\n  :root:not([data-theme=\"light\"]) .door-name .n2 { color: #7aa6db; }\n}\n:root[data-theme=\"dark\"] .door-name .n1 { color: #c8d2f5; }\n:root[data-theme=\"dark\"] .door-name .n2 { color: #7aa6db; }\n\n/* narrative is italic, always (Tom 8/31; scene-poc r27): context lines, verse, finale.\n   Cues, asks, and exercise Spanish stay upright by living outside .scene-line. */\n.scene-line .sl { font-style: italic; font-synthesis: style; }\n\n/* scene gloss tap: the revealed heard line can be asked what it meant */\n.gloss-tap { display: block; margin: 6px 0 10px; }\n\n/* READ-SIGN: the sign as a card (eyes channel) */\n.sign-card { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase;\n  text-align: center; padding: 26px 18px; margin: 14px 0 18px; border-radius: var(--radius); background: var(--solid-card);\n  border: 1px solid var(--border); box-shadow: var(--shadow); }\n/* THE CIRCUIT door line: honest, upright, no narrative italic */\n.circuit-line { font-family: var(--font-display); font-size: 21px; font-weight: 500; line-height: 1.35; color: var(--text); margin: 4px 0 18px; }\n.inv-ask { margin-bottom: 10px; }\n\n/* THE PROFILE EDIT (intake fix) */\n.profile-edit .pe-section { margin-top: 22px; }\n.profile-edit .pe-t { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-bottom: 4px; }\n.profile-edit .pe-s { font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.4; }\n.profile-edit .chips { margin-top: 6px; }\n.chips.chips-col { flex-direction: column; align-items: stretch; }\n\n/* the footer is always the top of the runner (Tom, 9/9: the primer's foreground sat over the\n   \"I'm in\" button on device once the runner claimed 100dvh; synthetic clicks never hit-test) */\n.footer { z-index: 30; }\n\n/* PAIRS (staged 9/12): the word sits at the card's true center - the glyph and bars ride the\n   edges instead of pushing the text; the text board has no glyph at all */\n.pcard.audio .pc-glyph, .pcard.audio .pbars { position: absolute; top: 50%; transform: translateY(-50%); }\n.pcard.audio .pc-glyph { left: 12px; }\n.pcard.audio .pbars { right: 12px; }\n.pcard.audio .es-word { margin: 0 22px; }\n.pcard.es { padding: 10px 12px; }\n.pairs.pairs-text { gap: 8px 12px; }\n.pairs.pairs-text .pcard { min-height: 50px; font-size: 15px; }\n\n/* PAIRS text board (staged 9/12): equal cards, more of the screen */\n.pairs.pairs-text { gap: 10px 12px; }\n.pairs.pairs-text .pcard { height: 62px; min-height: 62px; font-size: 16px; padding: 6px 10px; line-height: 1.2; }\n/* finish-the-sentence prototype: the context sentence carries the slot */\n.ctx-mount { font-size: 22px; }\n\n/* ===== THE ANCHORED LAYOUT (staged journey-1; Tom 9/13, measured off Duolingo) =====\n   The body learns its own top offset (--qtop, set by _anchor); every anchor is a viewport\n   percentage minus that. 16%: the exercise portion. 63%: the middle choice. 73%: the tile\n   bank. 47% and 53%: the two baselines the built sentence rests on. */\n#qbody.anchored { position: relative; min-height: calc(100dvh - var(--qtop, 90px) - 40px); }\n#qbody.anchored .top { position: absolute; left: 0; right: 0; top: calc(16dvh - var(--qtop, 90px)); }\n#qbody.anchored .direction { color: var(--text-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }\n#qbody.anchored .answers { position: absolute; left: 0; right: 0; translate: 0 -50%; }\n#qbody.anchored .answers.at63 { top: calc(63dvh - var(--qtop, 90px)); }\n#qbody.anchored .answers.at73 { top: calc(73dvh - var(--qtop, 90px)); }\n#qbody.anchored .answers .bank { justify-content: center; }\n#qbody.anchored .lines { position: absolute; left: 0; right: 0; top: calc(47dvh - var(--qtop, 90px)); height: 6.3dvh; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); pointer-events: none; }\n#qbody.anchored .build-answer { position: absolute; left: 0; right: 0; top: calc(47dvh - var(--qtop, 90px) - 46px); min-height: 0; border-bottom: none; margin: 0; padding: 0;\n  column-gap: 8px; row-gap: calc(6.3dvh - 38px); }                   /* row pitch = the band: row one rests on line one, row two on line two */\n#qbody.anchored .build-answer .word { height: 38px; box-sizing: border-box; display: inline-flex; align-items: center; }\n#qbody.anchored .build-answer.fused { column-gap: 5px; row-gap: calc(6.3dvh - 38px); }\n#qbody.anchored .build-answer.fused .word { height: 38px; }\n#qbody.anchored .build-answer .sweep { bottom: -4px; }\n#qbody.anchored .res-grown { margin-top: 18px; }\n\n/* ===== NUMBERS (rulings 2026-09-20; staged \"numbers-1\") ===== */\n.num-title { font-family: var(--font-display); font-size: 23px; font-weight: 700; line-height: 1.3; margin: 6px 0 14px; }\n.num-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.num-hand { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n.num-hand-label { margin: 16px 0 8px; }\n.num-chip { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; min-height: 46px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text);\n  border-radius: var(--radius-sm); box-shadow: var(--shadow); cursor: pointer; font-family: var(--font-display); text-align: left; transition: transform .12s cubic-bezier(.34,1.56,.64,1), border-color 200ms; }\n.num-chip:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.num-chip .n { font-size: 19px; font-weight: 800; min-width: 30px; color: var(--accent); }\n.num-chip .w { font-size: 16px; font-weight: 500; }\n.num-chip.heard { border-color: var(--accent); }\n.num-hand .num-chip { flex-direction: column; gap: 2px; align-items: flex-start; }\n.num-line { color: var(--text-dim); font-size: 14px; margin-top: 16px; }\n.num-status { color: var(--text-dim); font-size: 13px; margin-top: 8px; }\n/* the keypad: one surface, dialer order, 64px keys, the shipped tile chrome */\n#qbody.anchored .answers.atpad { top: auto; bottom: calc(76px + env(safe-area-inset-bottom)); translate: none; }   /* clear of the Continue bar, home indicator included (Tom 9/20) */\n#qbody.anchored .answers.atbill { top: calc(66.6dvh - var(--qtop, 90px)); translate: 0 -50%; }                        /* the bills center on the bottom-third line (Tom 9/20) */\n.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n.bills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }\n.nkey { height: 64px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); box-shadow: var(--shadow);\n  font-family: var(--font-display); font-size: 24px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;\n  transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s, opacity 300ms, border-color 300ms, background 300ms; }\n.nkey:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.nkey.wordkey { font-size: 16px; font-weight: 500; }\n.nkey.empty { visibility: hidden; box-shadow: none; }\n.nkey.vwrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }\n.nkey.dim { opacity: .35; pointer-events: none; }\n.nkey.delkey { color: var(--text); }   /* the calculator's delete: a key like the digits, a large glyph (Tom 9/20) */\n.num-tap-hint { display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 13px; margin: -6px 0 12px; }\n.num-tap-hint .ph { color: var(--accent-2, var(--accent)); flex: none; }\n.nkey.correct { border-color: var(--green); background: color-mix(in srgb, var(--green) 15%, transparent); }\n.nkey.bill { font-size: 18px; box-shadow: var(--shadow), inset 0 0 0 4px var(--bg-card), inset 0 0 0 5px var(--border); }   /* a bill face from tokens: the inner rule */\n.num-listen { margin: 6px 0 0; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; min-height: 0; padding: 0; text-align: left; }\n.num-listen .hint { margin: 0; }\n@media (max-height: 700px) { #qbody.anchored:has(.atpad) .top { top: calc(12dvh - var(--qtop, 90px)); } #qbody.anchored .answers.atpad { bottom: calc(62px + env(safe-area-inset-bottom)); } .numpad { gap: 8px; } .num-echo { min-height: 34px; margin-top: 6px; } }   /* short phones: the keypad keeps its 64px keys, the ask lifts */\n.num-echo { font-family: var(--font-display); font-size: 28px; font-weight: 600; min-height: 40px; margin-top: 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }\n.num-echo .ph { color: var(--text-dim); opacity: .5; }\n.num-echo .rv { font-size: 24px; } .num-echo i { font-style: normal; color: var(--text-dim); margin: 0 6px; }\n.num-echo.revealed { display: block; }\n.num-echo .rv-words { font-size: 22px; } .num-echo .rv-digits { font-size: 18px; color: var(--text-dim); margin-top: 2px; }\n.num-echo .miss { opacity: .35; }\n.num-spot { font-family: var(--font-display); font-size: 34px; font-weight: 700; min-height: 48px; margin-top: 12px; opacity: 1; transition: opacity 120ms; }\n.num-spot.off { opacity: 0; }\n.num-again { background: none; border: none; color: var(--text-dim); text-decoration: underline; font-size: 13px; padding: 8px 0; cursor: pointer; font-family: inherit; }\n\n/* PAIRS, one screen (Tom 9/20): a board over six rows sizes its cards to the screen, so nothing scrolls and the Continue bar stays in view.\n   290px = the chrome above (progress row, direction) + the all-set line + the Continue bar. */\n.pairs.pairs-fit { gap: 6px 12px; margin-top: 10px; }\n.pairs.pairs-fit .pcard, .pairs.pairs-text.pairs-fit .pcard { height: var(--pc-h, clamp(36px, calc((100dvh - 300px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / var(--rows) - 6px), 62px)); min-height: 0; padding: 4px 10px; line-height: 1.15; }\n.pairs.pairs-fit + .pairs-grown { margin-top: 10px; }\n\n/* THE PEEK (staged \"learn-peek\"): what a lesson holds, under its row */\n.lesson.has-peek { padding-right: 0; }\n.lesson .pk-zone { align-self: stretch; width: 52px; margin: -14px 0; flex: none; display: flex; align-items: center; justify-content: center; background: none; border: none;\n  border-left: 1px solid var(--border); color: var(--text-dim); cursor: pointer; padding: 0; border-radius: 0 var(--radius) var(--radius) 0; }\n.lesson .pk-zone .ph { transform: rotate(90deg); transition: transform 200ms cubic-bezier(.2,.7,.3,1); }      /* points down: there is more under here */\n.lesson.open .pk-zone .ph { transform: rotate(-90deg); }\n.lesson .pk-zone:active { background: color-mix(in srgb, var(--text) 6%, transparent); }\n.lesson-peek { margin: -2px 0 10px; padding: 4px 16px 14px 40px;   /* drawer option C (Tom 9/24): the line and the words 40px in, the labels 28px in, a 12px step above the words (option C2, Tom 9/24) */ opacity: 0; transform: translateY(-4px); transition: opacity 220ms cubic-bezier(.2,.7,.3,1), transform 220ms cubic-bezier(.2,.7,.3,1); }\n.lesson-peek.show { opacity: 1; transform: none; }\n.peek-list { display: grid; grid-template-columns: 1fr; gap: 0; }\n.peek-item { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }\n.peek-item:last-child { border-bottom: none; }\n.peek-item .es { font-family: var(--font-display); font-weight: 600; color: var(--text); }\n.peek-item .en { color: var(--text-dim); text-align: right; }\n.peek-frame { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--accent-2, var(--accent)); margin: 10px 0 2px; }\n.peek-frame:first-child { margin-top: 2px; }\n\n/* THE CHAPTER DOOR (chapter-flow): \"Chapter one\" in the logo faces; the chapter's name as the title line under the label */\n.chapter-door-title { font-family: var(--font-display); font-size: 27px; font-weight: 800; line-height: 1.15; letter-spacing: -.015em; margin: 18px 0 36px; white-space: nowrap; }   /* a full line of air before the subtitle (Tom 9/22) */   /* one line at 375px; the gap under it lets it read as the title (Tom 9/21) */\n@media (max-width: 359px) { .chapter-door-title { font-size: 24px; } }\n.chapter-door .scene-line { margin-bottom: 4px; }\n.door-name.chapter-name { display: flex; align-items: baseline; gap: 12px; left: 18px; }   /* left-justified with the title below (Tom 9/22) */\n.chapter-name .n2 { font-family: var(--font-display); font-style: normal; font-weight: 800; font-size: 1em; line-height: 1; }   /* the numeral in the title face, the logo's blue, the word's size (Tom 9/22) */\n.chapter-door .scene-line .sl { color: var(--text-dim); }                                   /* the subtitle in the whisper's grey (Tom 9/22) */\n.chapter-count { margin: 0; font-style: normal; font-weight: 600; }\n\n/* THE BLOOM (staged \"enter-bloom\"): the tapped tile, cloned, breathes with the lantern's aura behind it, grows to the screen, then clears */\n.bloom-cover { position: fixed; z-index: 2600; pointer-events: none; overflow: visible; background: transparent; transform-origin: center; will-change: transform;   /* the clone's OWN surface is what grows (the Home tile's blue, a row's card) */\n  transition: transform 190ms cubic-bezier(.2,.7,.3,1), opacity 320ms ease; }\n.bloom-cover.fill { transition: transform 200ms cubic-bezier(.4,0,.7,1), opacity 320ms ease; }   /* the fill accelerates: the tile comes toward you */\n.bloom-cover .bloom-tile { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; transform: none !important; box-shadow: none; z-index: 0; }\n.bloom-cover .bloom-tile > * { transition: opacity 120ms ease 70ms; }\n.bloom-cover.breathe .bloom-tile > *, .bloom-cover.fill .bloom-tile > * { opacity: 0; }   /* the words and the picture let go during the breathe */\n/* the aura: the splash lantern's recipe, a radial LAYER behind the tile (never a filter), soft, no line */\n.bloom-cover .bloom-aura { position: absolute; inset: -40% -18%; z-index: -1; border-radius: 50%; opacity: 0; pointer-events: none;\n  background: radial-gradient(closest-side at 50% 50%, rgba(216,183,19,0.42) 0%, rgba(216,183,19,0.28) 35%, rgba(216,183,19,0.14) 58%, rgba(216,183,19,0.05) 78%, rgba(216,183,19,0) 100%);\n  transition: opacity 190ms ease, inset 170ms cubic-bezier(.4,0,.6,1); }\n.bloom-cover.breathe { transform: scale(1.06); }\n.bloom-cover.breathe .bloom-aura { opacity: 1; }\n.bloom-cover.breathe .bloom-light { opacity: 1; }                                    /* the light is there from the first beat, small behind the tile, and grows with it into the oblong (Tom 9/22) */\n/* as the tile grows it DISSIPATES and the light takes over (Tom 9/22, against Duolingo's dark hold): the surface fades out over the\n   growth while a brighter light, riding the same scale, comes up to fill the screen; the clear then fades the light to the new screen */\n.bloom-cover .bloom-light { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: -1; border-radius: 50%; opacity: 0; pointer-events: none;\n  background: radial-gradient(closest-side, rgba(216,183,19,0.55) 0%, rgba(216,183,19,0.32) 42%, rgba(216,183,19,0.14) 70%, rgba(216,183,19,0) 100%);   /* the first cut's light (v306): a glow at the center reaching the corners, grey outside (Tom's recording, 9/22) */\n  transition: opacity 200ms cubic-bezier(.4,0,.7,1); }\n.bloom-cover.fill .bloom-aura { opacity: 0; }                                       /* one light during the growth, not two stacked (Tom 9/22: too bright) */\n.bloom-cover.fill .bloom-light { opacity: 1; }\n.bloom-cover.fill .bloom-tile { opacity: 0; transition: opacity 90ms ease; }         /* the tile lets go as soon as the growth starts: the LIGHT is the effect, not the blue (Tom 9/22) */\n.bloom-cover.clear { opacity: 0; }\n#app.bloom-fade, .sheet-wrap.bloom-fade, #tabbar.bloom-fade, .topbar.bloom-fade, .home-atmo.bloom-fade { transition: opacity 260ms ease; opacity: 0; }   /* the page greys out to the bare ground as the light grows; the exercise then comes in on a blank screen (Tom 9/22, Duolingo) */\n\n/* THE BLOOM, white (compare switch \"bloom-white\"): the loading page's daybreak rather than the lantern's gold. The aura stays gold\n   during the breathe (it starts from behind the tile), then the light that takes over is white. */\n.bloom-cover .bloom-day { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; z-index: 0; border-radius: 50%; opacity: 0; pointer-events: none;\n  background: radial-gradient(closest-side, rgba(255,250,236,0.82) 0%, rgba(255,250,236,0.5) 40%, rgba(255,250,236,0.2) 68%, rgba(255,250,236,0) 100%); transition: opacity 240ms ease; }\n.bloom-cover.white.day .bloom-day { opacity: 1; }                                    /* the gold light stays underneath; the white rises over it */\n\n/* THE TILE IS THE BUTTON (staged \"hero-start\", option A): a pressed edge, the whole card sinks on press; the chevron went 9/24 */\n.hero-tile.as-button { min-height: 135px; border-bottom: 4px solid #222c66; box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 34px 10px rgba(216,183,19,0); }   /* the invisible shadow holds the box at the glow's reach while the pulse waits (see hero-pulse) */   /* 135px (Tom 9/24) */\n.hero-tile.as-button .hero-inner { width: 70%; padding: 16px 16px 14px; gap: 0; justify-content: flex-start; }   /* the rows stack from the top: kicker, title, the line right under it (Tom 9/24) */\n.hero-tile.as-button .hero-title { margin: 4px 0 8px; }\n.hero-tile.as-button:active { transform: translateY(3px); border-bottom-width: 1px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }   /* the key goes down onto its edge */\n/* THE STRIP (Tom 9/24, mock F2): a slim deeper-navy strip down the tile's right edge holds the chevron; the photo stops short of it,\n   fading over its last sixth. The tile reads as content on the left and a press-me end on the right. */\n.hero-tile.as-button .hero-img { right: 33px; -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 84%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, #000 84%, transparent 100%); }\n.hero-tile.as-button .hero-strip { position: absolute; top: 0; right: 0; bottom: 0; width: 33px; display: flex; align-items: center; justify-content: center; background: #151d48; border-left: 1px solid rgba(255,255,255,.14); color: var(--accent); }\n.hero-tile.as-button .hero-strip svg { display: block; }\n\n/* PORTRAIT ONLY: the upright card shows only on a phone held sideways (a short, wide viewport); never on tablets or desktops */\n.turn-upright { flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bg); color: var(--text); text-align: center; padding: 24px; }   /* placed and shown by ui.js only while the phone is sideways; never by a rule here */\n.turn-upright .tu-mark { margin-bottom: 6px; }\n.turn-upright .tu-line { font-family: var(--font-display); font-size: 18px; font-weight: 700; }\n.turn-upright .tu-sub { color: var(--text-dim); font-size: 14px; }\n\n/* THE PRACTICE ROW AS A BUTTON (staged \"hero-start\", Tom 9/24): the Learn row's build (card, radius, 14px/16px padding) with the action\n   tile's pressed edge, and the same press: the key goes down onto its edge */\n.practice.as-button { border-radius: var(--radius); padding: 14px 16px; min-height: 60px; margin-bottom: 4px;\n  box-shadow: 0 4px 0 color-mix(in srgb, var(--border) 60%, #000), 0 6px 14px rgba(0,0,0,.3); }   /* the outline stays all the way round; the pressed edge sits beneath it (Tom 9/24) */\n.practice.as-button:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--border) 60%, #000), 0 2px 6px rgba(0,0,0,.3); }\n/* THE PULSE (Tom 9/24, Duolingo's cue for \"this one\"): a slow gold glow breathing behind the action tile, drawn as a shadow so iPhone renders it */\n/* every frame ends with an invisible shadow at the glow's full reach (34px blur, 10px spread): the tile's drawn box then never changes size\n   while the glow breathes. Without it the tile, now on its own layer (v398), was re-placed every frame and vibrated (Tom's recording 10/3). */\n@keyframes hero-pulse { 0%, 100% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 0 rgba(216,183,19,0), 0 0 18px 2px rgba(216,183,19,.18), 0 0 34px 10px rgba(216,183,19,0); } 50% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 2px rgba(216,183,19,.28), 0 0 34px 10px rgba(216,183,19,.42), 0 0 34px 10px rgba(216,183,19,0); } }\n@keyframes hero-pulse-first { 0% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 0 rgba(216,183,19,0), 0 0 0 0 rgba(216,183,19,0), 0 0 34px 10px rgba(216,183,19,0); } 50% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 2px rgba(216,183,19,.28), 0 0 34px 10px rgba(216,183,19,.42), 0 0 34px 10px rgba(216,183,19,0); } 100% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 0 rgba(216,183,19,0), 0 0 18px 2px rgba(216,183,19,.18), 0 0 34px 10px rgba(216,183,19,0); } }\n/* the first cycle is ONE motion: from nothing up to the peak and down to rest, then the loop takes over at rest (Tom's recording 9/29: a separate rise-in read as a hitch) */\n.hero-tile.as-button { animation: hero-pulse-first 2600ms ease-in-out both, hero-pulse 2600ms ease-in-out 2600ms infinite; }\nbody.arriving .hero-tile.as-button { animation: none; }   /* the pulse waits for the arrival: it begins as the candle finishes igniting (Tom 9/25) */\nbody.arriving.pulse-go .hero-tile.as-button { animation: hero-pulse-first 2600ms ease-in-out both, hero-pulse 2600ms ease-in-out 2600ms infinite; }   /* Test Lab (Tom 9/29): the tile begins as the corner light leaves its apex */\n.hero-tile.as-button:active { animation: none; }\n@media (prefers-reduced-motion: reduce) { .hero-tile.as-button { animation: none; } }\n/* THE DOORS LEAVE ON THE SLIDE (Tom 9/24): the chapter door travels out like #qbody.leaving; the scene door lives in #qbody and uses it */\n.chapter-door.leaving { transform: translateX(-110%); transition: transform 350ms cubic-bezier(.4,.05,.7,.5); }\n@media (prefers-reduced-motion: reduce) { .chapter-door.leaving { transform: none; opacity: 0; transition: opacity 200ms ease; } }\n/* THE CHAPTER DOOR, UPLEVELED (STAGED \"door-swash\", Tom 9/24, mock E-wide): centered; 13 SESSIONS under Chapter 1; the title in the logo's\n   italic serif; the gold doubled swash between title and subtitle; the subtitle upright in the whisper's grey */\n.chapter-door.swash { text-align: center; }\n.chapter-door.swash .door-name.chapter-name { left: 0; right: 0; bottom: 8px; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }\n.chapter-door.swash .chapter-count { font-family: var(--font-text); }\n.chapter-door.swash .chapter-name .n1 { color: #c8d2f5; }\n.chapter-door.swash .chapter-name .n2 { color: #7aa6db; }   /* the 1 in the darker blue again (Tom 9/25, mock T3) */\n.chapter-door.swash .chapter-door-title { font-family: 'Source Serif 4', Georgia, serif; font-style: normal; font-weight: 600; font-size: 28px; letter-spacing: 0; color: var(--text); white-space: normal; margin: 18px 0 34px; }   /* the title in Source Serif 4, white (Tom 9/25, mock T3): a book serif with Jakarta's even strokes */   /* the title in the app's face, in the darker blue the numeral wore; 34px under it so the lantern's glow clears the title (Tom 9/25) */\n.chapter-door.swash .door-mark-row { display: flex; justify-content: center; margin: 0 0 18px; }\n.chapter-door.swash .door-mark { position: relative; display: inline-block; }\n.chapter-door.swash .door-mark .lighthouse { position: relative; }\n/* the lantern's light (mock L1-c2): the splash's aura recipe as a radial LAYER behind the mark (never a filter), centered on the lantern near the top */\n.chapter-door.swash .door-mark-glow { position: absolute; inset: -46px -60px; pointer-events: none;\n  background: radial-gradient(closest-side at 50% 40%, rgba(216,183,19,0.30) 0%, rgba(216,183,19,0.18) 35%, rgba(216,183,19,0.09) 60%, rgba(216,183,19,0.03) 80%, rgba(216,183,19,0) 100%); }\n.chapter-door.swash .scene-line { margin: 0; }\n.chapter-door.swash .scene-line .sl { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-style: normal; font-size: 18px; color: #b9bfcc; }   /* the line in the same serif, a light grey between the whisper and white (T3) */   /* the subtitle in the app's italic voice, white (the base of the mocks Tom picked from) */\n/* EAR SESSIONS (Tom 9/26, mocks T1 + R2): \"Best with sound\" as a small gold pill under the tile's line; bare gold words beside the Learn row's count;\n   the hear-first card hides its words until the line has played; the ear escape's two full buttons stack in the footer */\n.hero-tile .ear-pill { display: inline-flex; align-self: flex-start; align-items: center; margin-top: 8px; font-family: var(--font-display); font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(216,183,19,.55); border-radius: 999px; padding: 2px 7px; white-space: nowrap; }\n.lmeta .ear-tag { font-family: var(--font-display); font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-2); white-space: nowrap; }\n.footer .btn + .btn.grey { margin-top: 10px; }\n/* the read-and-pick rung's confirmation (Tom 9/26): the word at the top takes the reveal's green sweep in place */\n.prompt.mc-word { position: relative; display: inline-block; margin-bottom: 16px; }   /* room under the word for the sweep, so the speaker clears it (Tom 9/26) */\n.prompt.mc-word .sweep2 { position: absolute; left: 0; right: 0; bottom: -6px; height: 2.5px; background: var(--green); border-radius: 2px; transform-origin: left; animation: sweep-in 420ms cubic-bezier(.2,.7,.3,1) both; }\n@keyframes sweep-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n/* THE PLATE (Tom 9/26, STAGED \"sign-plates\"): a sign drawn as a sign. Light theme: enamel, a deeper cream than the page with a navy\n   edge. Dark theme: the door plate, dark with cream letters. One plate, two shades, picked by the theme. */\n.plate { display: inline-block; padding: 14px 22px; border-radius: 8px; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;\n  background: #ebe4cf; color: #1c275e; box-shadow: inset 0 0 0 2px #1c275e, inset 0 0 0 5px #ebe4cf, inset 0 0 0 6px rgba(28,39,94,.4), 0 0 0 1.5px #1c275e, 0 8px 18px rgba(28,39,94,.22);\n  transition: box-shadow 200ms ease, opacity 200ms ease; }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .plate { background: #141a33; color: #f3efe2; box-shadow: inset 0 0 0 2px rgba(243,239,226,.85), inset 0 0 0 5px #141a33, inset 0 0 0 6px rgba(243,239,226,.35), 0 6px 14px rgba(0,0,0,.35); } }\n:root[data-theme=\"dark\"] .plate { background: #141a33; color: #f3efe2; box-shadow: inset 0 0 0 2px rgba(243,239,226,.85), inset 0 0 0 5px #141a33, inset 0 0 0 6px rgba(243,239,226,.35), 0 6px 14px rgba(0,0,0,.35); }\n.plate.sm { font-size: 18px; padding: 10px 14px; letter-spacing: .06em; }\n.plate.confirmed { box-shadow: inset 0 0 0 2px var(--green), inset 0 0 0 5px transparent, 0 0 0 2px var(--green), 0 6px 14px rgba(0,0,0,.3) !important; }\n.plate.wrong { opacity: .55; } .plate.dim { opacity: .35; }\n.plate-stage { text-align: center; margin-top: 14px; }\n.plate.tt { text-align: left; padding: 12px 16px 10px; font-size: 14px; letter-spacing: .02em; text-transform: none; font-weight: 600; min-width: 260px; white-space: normal; }\n.tt-head { font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; text-align: center; border-bottom: 1.5px solid currentColor; padding-bottom: 6px; margin-bottom: 8px; opacity: .9; }\n.tt-row { display: flex; justify-content: space-between; gap: 14px; padding: 3px 0; }\n.tt-day { font-weight: 700; } .tt-hrs { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }\n.act-sit { font-family: var(--font-display); font-size: 23px; font-weight: 700; line-height: 1.3; margin-top: 18px; }\n.act-sit.long { font-size: 19px; margin-top: 14px; }   /* the timetable situations run to three lines; a step down so they clear the answers (Tom 9/28) */   /* the same size as every other rung's English cue (Tom 9/28) */\n.act-sit.need { margin-top: 6px; }\n.choices.plates { flex-direction: row; flex-wrap: wrap; gap: 12px; justify-content: center; }\n.choices.plates .choice, .choices.plates .choice.correct, .choices.plates .choice.wrong, .choices.plates .choice.dim { width: auto; padding: 0; background: none; border: none; box-shadow: none; }\n.present-card.sign-card { text-align: center; }\n.present-card.sign-card .plate-stage { margin-top: 4px; }\n.present-card.sign-card .present-en { margin-top: 16px; font-size: 18px; }\n.plate-place { font-size: 13px; color: var(--text-dim); margin-top: 10px; }\n/* the days set card (mock S1), the wall (G1), the week in order (D1); Tom 9/28 */\n.days-grid { grid-template-columns: 1fr; }\n.day-chip { justify-content: flex-start; }\n.day-chip .n { min-width: 26px; }\n.day-chip .w { font-weight: 700; }\n.day-chip .en { margin-left: auto; font-size: 13px; color: var(--text-dim); }\n.choices.plates.wall { gap: 10px 12px; }\n.choices.plates.wall .plate.sm { font-size: 14px; padding: 8px 10px; }\n.choices.plates .choice.found { pointer-events: none; }\n.choices.plates .choice.found .plate.confirmed { opacity: .55; transition: opacity 600ms ease 500ms; }   /* the found sign keeps its green edge and settles back, so the wall thins but stays collected */\n.order-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; min-height: 46px; padding: 8px; border: 1px dashed var(--border); border-radius: 12px; }   /* centered (Tom 9/28) */\n.order-row .plate.sm { font-size: 14px; padding: 8px 10px; }\n#qbody.anchored .res-grown.grown-below { position: absolute; left: 0; right: 0; top: calc(79dvh - var(--qtop, 90px)); text-align: center; }   /* under the three answers, above the footer */\n/* the closers hold still (Tom 9/28): a taken plate leaves a ghost slot; the pool recedes at the end; the closing sentence fades in below */\n.choices.plates .choice.ghost { visibility: hidden; pointer-events: none; }\n.choices.plates.recede { opacity: 0; transition: opacity 500ms ease; }\n.act-sit.fade { opacity: 0; transition: opacity 400ms ease; }\n.res-grown.closer-line { text-align: center; padding: 0 8px; }\n.res-grown.closer-line .pairs-allset { font-size: 15px; color: var(--text); line-height: 1.4; }\n/* equal-width plates (Tom 9/28, mocks W1 / K1): the wall and the week on a 3-column grid; the row above the week uses the same grid */\n.plates-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-items: stretch; transition: opacity 500ms ease; }\n.plates-grid .choice, .plates-grid .choice.correct, .plates-grid .choice.wrong, .plates-grid .choice.dim { width: auto; padding: 0; background: none; border: none; box-shadow: none; }\n.plates-grid .plate { display: block; width: 100%; box-sizing: border-box; text-align: center; font-size: 13px; padding: 10px 4px; letter-spacing: .05em; }\n.plates-grid .choice.ghost { visibility: hidden; pointer-events: none; }\n.plates-grid .choice.found { pointer-events: none; }\n.plates-grid .choice.found .plate.confirmed { opacity: .55; transition: opacity 600ms ease 500ms; }\n.plates-grid.recede { opacity: 0; }\n.plates-grid.last-two > .choice:nth-last-child(2) { grid-column: 1; margin-left: 50%; width: calc(100% + 5px); } .plates-grid.last-two > .choice:last-child { grid-column: 2; margin-left: 50%; width: calc(100% + 5px); }   /* a last row of two, centered */\n.plates-grid.last-one > .choice:last-child { grid-column: 2; }   /* a last row of one, centered */\n.order-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n.order-grid .plate { display: block; width: 100%; box-sizing: border-box; text-align: center; font-size: 13px; padding: 9px 4px; letter-spacing: .05em; }\n.order-grid > .plate:nth-child(3n+1):last-child { grid-column: 2; }   /* a lone plate on the last row sits in the middle (Domingo; Tom 9/28) */\n/* TEST LAB ARRIVAL CANDIDATES (Tom 9/29; dev replays only, the shipped formation is untouched). \"From darkness\" retired 9/29. */\nbody.arr-twilight .home-atmo .atmo-photo, body.arriving:not(.arr-classic) .home-atmo .atmo-photo, body.arriving:not(.arr-classic) .topbar, body.arriving:not(.arr-classic) .trip, body.arriving:not(.arr-classic) .scores, body.arriving:not(.arr-classic) .empty-hero, body.arriving:not(.arr-classic) .hero-tile, body.arriving:not(.arr-classic) .practice, body.arriving:not(.arr-classic) .home-diverge, body.arriving:not(.arr-classic) .whisper, body.arriving:not(.arr-classic) .presence, body.arriving:not(.arr-classic) #tabbar, body.arr-twilight3 .home-atmo .atmo-photo, body.arr-twilight3 .topbar, body.arr-twilight3 .trip, body.arr-twilight3 .scores, body.arr-twilight3 .empty-hero, body.arr-twilight3 .hero-tile, body.arr-twilight3 .practice, body.arr-twilight3 .home-diverge, body.arr-twilight3 .whisper, body.arr-twilight3 .presence, body.arr-twilight3 #tabbar, body.arr-twilight .topbar, body.arr-twilight .trip, body.arr-twilight .scores, body.arr-twilight .empty-hero,\nbody.arr-twilight .hero-tile, body.arr-twilight .practice, body.arr-twilight .home-diverge, body.arr-twilight .whisper, body.arr-twilight .presence, body.arr-twilight #tabbar {\n  transition-duration: 1400ms !important; transition-timing-function: cubic-bezier(.3,.05,.2,1) !important; }   /* twilight: one long breath together */\nbody.arr-twilight .home-atmo .atmo-ground.arr-in { animation-duration: 1400ms; }\nbody.arr-twilight3 .home-atmo .atmo-ground, body.arriving:not(.arr-classic):not(.arr-twilight) .home-atmo .atmo-ground { transform-origin: 0% 100%; }\nbody.arr-twilight3 .home-atmo .atmo-ground.arr-in, body.arriving:not(.arr-classic):not(.arr-twilight) .home-atmo .atmo-ground.arr-in { animation: ground-breathe 3000ms both; }   /* twilight, breathing: up in one motion with everything else, past rest, then back down (bigger and longer, Tom 9/29) */\n@keyframes ground-breathe {\n  0%   { opacity: 0; transform: scale(.86); animation-timing-function: cubic-bezier(.3,.05,.2,1); }\n  53%  { opacity: 1; transform: scale(1.12); filter: brightness(1.2); animation-timing-function: cubic-bezier(.4,0,.3,1); }   /* 1.6s: the peak, 12% past rest and a fifth brighter */\n  100% { opacity: 1; transform: scale(1); filter: brightness(1); } }\n/* THE ONE LIGHT (Tom 10/2): a single candle for the whole app, and it TRAVELS: .candle-pos is three screens wide with the source at its\n   middle, so sliding it sideways puts the source in the bottom-left corner on Home and under the active tab elsewhere; it glides 620ms,\n   70ms behind the nav line (the flame follows the candle). The light ITSELF is exactly Home's ground as it was before 10/2 (Tom:\n   \"use the 15-36 recording as the reference\"): one glow, the same reach, the same breath at launch, the same flame on Home. */\n.tab-candle { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; transition: opacity 400ms ease; }\n#app { position: relative; z-index: 1; }   /* the content sits above the light on every tab (the bars are 10, 40, 60) */\n.candle-pos { position: absolute; top: 0; left: -100%; width: 300%; height: 100%; transform: translateX(var(--tx, 0px)); transition: transform 620ms cubic-bezier(.25,.8,.3,1) 70ms; will-change: transform; }\n.candle-wash { position: absolute; inset: 0; transform-origin: 54.67% 100%;   /* = the screen's bottom-left corner when the source is at Home, the origin the ground always breathed from */\n  background: radial-gradient(61.667% 165% at 50% 116%, color-mix(in srgb, #c96a2b 40%, transparent) 0%, color-mix(in srgb, #e0952b 24%, transparent) 30%, color-mix(in srgb, var(--accent) 14%, transparent) 55%, color-mix(in srgb, var(--accent) 6%, transparent) 76%, transparent 94%);\n  animation: candle-glow-tab 7900ms ease-in-out infinite alternate, candle-flicker-tab 1700ms ease-in-out infinite alternate; }   /* off Home: brightness only, nothing slides */\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .candle-wash { background: radial-gradient(61.667% 165% at 50% 116%, rgba(201,106,43,.32) 0%, rgba(230,198,42,.12) 40%, rgba(230,198,42,.05) 68%, transparent 94%); } }\n:root[data-theme=\"dark\"] .candle-wash { background: radial-gradient(61.667% 165% at 50% 116%, rgba(201,106,43,.32) 0%, rgba(230,198,42,.12) 40%, rgba(230,198,42,.05) 68%, transparent 94%); }\nbody.home-lit .candle-wash { animation: candle-drift 5300ms ease-in-out infinite alternate, candle-glow 7900ms ease-in-out infinite alternate, candle-flicker 1700ms ease-in-out infinite alternate; }   /* on Home: the drifting flame */\n/* the flame at the strength Tom approved in the Test Lab on 9/29 (v389). It was doubled on 10/2 and read as the background moving (recordings 15-50, 16-06) */\n@keyframes candle-drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.035) translate(5px, -4px); } }\n@keyframes candle-glow { from { filter: brightness(1); } to { filter: brightness(1.09); } }\n@keyframes candle-flicker { from { opacity: 1; } to { opacity: .94; } }\nbody.flame-still .candle-wash { animation: none !important; }   /* Test Lab: the light held still, to tell the flame apart from anything else that moves */\n@keyframes candle-glow-tab { from { filter: brightness(1); } to { filter: brightness(1.07); } }\n@keyframes candle-flicker-tab { from { opacity: 1; } to { opacity: .95; } }\nbody.in-runner .tab-candle, .tab-candle.bloom-fade { opacity: 0; }                                  /* runners have no candle; the bloom takes it with the bars */\nbody.in-runner .candle-wash { animation-play-state: paused; }\n/* the arrival: dark until its turn, then the breath exactly as before 10/2 (out past rest and back, from the corner) */\nbody.arriving .tab-candle { opacity: 0; }\nbody.arriving .tab-candle.arr-in { opacity: 1; transition: none; }\nbody.arriving .tab-candle.arr-in .candle-wash { animation: ground-breathe 3000ms both; }\nbody.arriving.arr-twilight .tab-candle.arr-in .candle-wash, body.arriving.arr-classic .tab-candle.arr-in .candle-wash { animation: ground-ignite 1400ms cubic-bezier(.3,.05,.2,1) both; }\nbody.arriving.arr-classic .tab-candle.arr-in .candle-wash { animation-duration: 1800ms; animation-timing-function: cubic-bezier(.45,.05,.3,.95); }\n@media (prefers-reduced-motion: reduce) { .candle-wash { animation: none !important; } .candle-pos { transition: none; } }\n/* THE SHIFT (Tom's recording 10/2, frames 5.2s vs 5.75s: every element moved together): twilight kept the old formation's 4px rise and\n   stretched it over 1.4s, so its tail landed after everything was already visible. Twilight is a fade only; the rise belongs to the old formation. */\nbody.arriving:not(.arr-classic) .home-atmo .atmo-photo, body.arriving:not(.arr-classic) .topbar, body.arriving:not(.arr-classic) .trip, body.arriving:not(.arr-classic) .scores,\nbody.arriving:not(.arr-classic) .empty-hero, body.arriving:not(.arr-classic) .hero-tile, body.arriving:not(.arr-classic) .practice, body.arriving:not(.arr-classic) .home-diverge,\nbody.arriving:not(.arr-classic) .whisper, body.arriving:not(.arr-classic) .presence { transform: none; }\n/* THE JUMP AT THE END OF THE FADE (recording 10/2 16-06, measured element by element): on the exact frame the 1.4s fade finishes, the dials and\n   the tile drop 3 device pixels, the presence line 2, while the Review row, the header bar and the tab bar stay put. The ones that stay are the ones\n   iPhone always draws on a layer of their own (blurred backdrop, sticky, fixed); the ones that jump only get a layer for the length of the fade and\n   are redrawn into the page when it ends. So they keep their layer, like the Review row: nothing is handed over, nothing lands anywhere new. */\n.home .trip, .home .scores, .home .empty-hero, .home .hero-tile, .home .home-diverge, .home .whisper, .home .presence { will-change: transform, opacity; }\n\n";
