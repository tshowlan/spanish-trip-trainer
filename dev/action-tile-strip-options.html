<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The strip on the right</title>
<style>
  body { background: #111; color: #ddd; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 22px; }
  h1 { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: #eee; } .sub { font-size: 13px; color: #999; margin: 0 0 18px; max-width: 900px; line-height: 1.5; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; } .cell { display: flex; flex-direction: column; gap: 8px; width: 300px; margin-bottom: 18px; }
  .cap { font-size: 12px; color: #aaa; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; } .note { font-size: 12px; color: #888; line-height: 1.45; }
  .frame { width: 300px; height: 150px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 4px #2a2a2a; background: #000; }
  .frame iframe { width: 375px; height: 188px; border: 0; transform: scale(.8); transform-origin: 0 0; pointer-events: none; }
</style></head><body>
<h1>A more gradual fade before the chevron (nothing staged)</h1>
<p class="sub">135px tile as it is today (pressed edge, the pulse left out of the stills). In each, the photo ends where the strip begins, so the tile reads as content on the left and a press-me end on the right. The chevron scales with the strip.</p>
<div class="row" id="rows"></div>
<script>
const CSS = ":root {\n  /* ---- color (light / cream theme) ---- */\n  --bg: #fcfcf3;            /* cream */\n  --bg-card: #ffffff;\n  --bg-nav: #ffffff;        /* floating tab bar \u2014 matches card in light */\n  --bg-elevated: #f1eee1;   /* warm light gray */\n  --text: #050505;\n  --text-dim: #5e6672;\n  --primary: #1c275e;       /* navy \u2014 primary actions */\n  --secondary: #4a7fc1;     /* blue \u2014 links / secondary */\n  --accent: #d8b713;        /* gold \u2014 highlights/fills */\n  --accent-2: #a98a0c;      /* deeper gold \u2014 text/numbers on cream */\n  --green: #2f9e57;         /* success */\n  --green-dark: #25814a;\n  --red: #d3384c;           /* error */\n  --border: #e6e2d2;\n  --ring-track: rgba(28,25,18,0.17);   /* translucent dark so dials read over the bright photo + cream (light) */\n  --wordmark-1: #1c275e;    /* \"Trip\"  */\n  --wordmark-2: #4a7fc1;    /* \"fluent\" */\n\n  /* ---- type ---- */\n  --font-display: \"Plus Jakarta Sans\", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;\n  --font-text: \"Inter\", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;\n  --text-xs: 12px;\n  --text-sm: 14px;\n  --text-base: 16px;\n  --text-lg: 20px;\n  --text-xl: 25px;\n  --text-2xl: 31px;\n  --text-3xl: 39px;\n\n  /* ---- spacing (\u22481.5 step) ---- */\n  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;\n  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;\n\n  /* ---- radius ---- */\n  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px;\n  --radius: 16px;                      /* legacy alias */\n\n  /* ---- motion ---- */\n  --transition: 160ms cubic-bezier(.2,.7,.3,1);\n\n  --shadow: 0 3px 0 rgba(28,39,94,.16);\n  --shadow-press: 0 1px 0 rgba(28,39,94,.16);   /* \u00a72.1 push-down: the offset shadow collapses on press */\n  /* THE FIELD composites (listening-family 2026-07-25): over the facet ground every\n     functional surface is OPAQUE \u2014 these are the solid stand-ins for card/track */\n  --solid-card: #ffffff;\n  --solid-track: #d9d4c2;\n  --t-slow: 300ms;                              /* \u00a72.2 sheet / screen transitions (micro = --transition 160ms) */\n  font-family: var(--font-text);\n}\n/* \u00a72.2 honor reduced motion \u2014 transitions/animations collapse to instant state changes */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }\n}\n\n/* ---- dark theme (warm charcoal). Applies via prefers-color-scheme when the\n   user is on \"system\", or when the root is stamped data-theme=\"dark\". ---- */\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { color-scheme: dark;\n    --bg: #05060d; --bg-nav: rgba(28,26,18,0.82); --bg-card: rgba(38,36,26,0.72); --bg-elevated: rgba(48,45,32,0.55); --text: #f6f4ea; --text-dim: #a7a494;\n    --primary: #3a4894; --secondary: #7aa6db; --accent: #e6c62a; --accent-2: #e0bf2e;\n    --green: #3fb56a; --green-dark: #35a05d; --red: #e8586a; --border: rgba(120,112,80,0.35);\n    --wordmark-1: #c8d2f5; --wordmark-2: #7aa6db; --shadow: 0 3px 0 rgba(0,0,0,.45); --shadow-press: 0 1px 0 rgba(0,0,0,.45);\n    --solid-card: #201e18; --solid-track: #55523f;\n    /* atmosphere (\u00a72.1): dark sits on a gradient ground, not flat black; surfaces frost over it */\n    --ground: radial-gradient(120% 52% at 50% -6%, rgba(201,106,43,0.22) 0%, rgba(216,183,19,0.08) 34%, transparent 62%), linear-gradient(180deg, #101226 0%, #0a0b18 40%, #05060d 100%);\n    --card-blur: blur(12px);\n    --ring-track: rgba(92,90,86,0.82);   /* near-opaque so dials read over the photo, not translucent --bg-elevated */\n  }\n}\n:root[data-theme=\"dark\"] { color-scheme: dark;\n  --bg: #05060d; --bg-nav: rgba(28,26,18,0.82); --bg-card: rgba(38,36,26,0.72); --bg-elevated: rgba(48,45,32,0.55); --text: #f6f4ea; --text-dim: #a7a494;\n  --primary: #3a4894; --secondary: #7aa6db; --accent: #e6c62a; --accent-2: #e0bf2e;\n  --green: #3fb56a; --green-dark: #35a05d; --red: #e8586a; --border: rgba(120,112,80,0.35);\n  --wordmark-1: #c8d2f5; --wordmark-2: #7aa6db; --shadow: 0 3px 0 rgba(0,0,0,.45); --shadow-press: 0 1px 0 rgba(0,0,0,.45);\n  --solid-card: #201e18; --solid-track: #55523f;\n  /* atmosphere (\u00a72.1): dark sits on a gradient ground, not flat black; surfaces frost over it */\n  --ground: radial-gradient(120% 52% at 50% -6%, rgba(201,106,43,0.22) 0%, rgba(216,183,19,0.08) 34%, transparent 62%), linear-gradient(180deg, #101226 0%, #0a0b18 40%, #05060d 100%);\n  --card-blur: blur(12px);\n  --ring-track: rgba(92,90,86,0.82);\n}\n\n.app-version { text-align: center; color: var(--text-dim); font-size: 11px; font-weight: 700; opacity: .5; margin: 22px 0 6px; cursor: default; user-select: none; }\n\n/* Display face for headings \u2014 matches the wordmark (Plus Jakarta Sans) */\nh1, h2, h3, .hero h1, .onb-card h2, .complete h2, .stage-head h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; }\n\n/* icons + wordmark */\n.ph { display: inline-block; vertical-align: middle; flex: none; }\n.wordmark { max-width: 100%; height: auto; }\n.hero-mark { display: flex; align-items: center; gap: 4px; }\n.lighthouse { flex: none; }\n\n/* ===== THE ARRIVAL (splash, design/splash-arrival.html 2026-07-25) =====\n   Black and the lighthouse (tinted by its own light) -> eclipse from behind the\n   lantern -> daybreak to the THEME'S ground -> the formation (session-end's refill\n   grammar) -> the candle (home's corner glow, 1.8s, one curve). Tap-to-skip snaps\n   to the finished home. Tint + relight ARE the design (stamped). */\n#splash {\n  position: fixed; inset: 0; z-index: 2000; overflow: clip;   /* clip, never a scroll container: the flood at \u00d785 gave it scrollable overflow, and a stray scroll dropped the lighthouse a pixel (Tom 9/22) */\n  background:\n    radial-gradient(130% 100% at 5 nimation: arr-consume 400ms ease 1950ms both; }\n@keyframes arr-consume { from { opacity: 1; } to { opacity: 0; } }\n.splash-lh { animation: arr-rise 900ms cubic-bezier(.2,.7,.3,1) both; position: relative; will-change: transform; backface-visibility: hidden; }\n.splash-lh .lighthouse { height: 110px; width: auto; position: relative; z-index: 1; }\n/* the aura is its own radial LAYER, never a filter: iOS Safari clips the filter's\n   paint region at a straight edge (the line above the lighthouse, Tom's device catch) */\n.splash-lh::before { content: \"\"; position: absolute; inset: -96px -110px; pointer-events: none;\n  background: radial-gradient(closest-side at 50% 45%,\n    rgba(216,183,19,0.26) 0%, rgba(216,183,19,0.17) 35%, rgba(216,183,19,0.09) 58%,\n    rgba(216,183,19,0.035) 78%, rgba(216,183,19,0) 100%); }\n.splash-wm { animation: arr-fade 700ms ease 350ms both; }\n.splash-wm .wordmark { height: 34px; width: auto; }\n/* halo rule: marks on the black frame carry the dark-theme brand fills, both themes */\n.splash-wm .wordmark path { fill: #c8d2f5; }\n.splash-wm .wordmark g g:nth-child(n+5) path { fill: #7aa6db; }\n@keyframes arr-rise { from { transform: translateY(14px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }\n@keyframes arr-fade { from { opacity: 0; } to { opacity: 1; } }\n/* the eclipse: the flood swells FROM BEHIND THE LANTERN (z1, under the stack) \u2014\n   the mark silhouettes against its own light before it is consumed */\n.splash-flood { position: absolute; left: 50%; top: calc(34% - 55px); width: 34px; height: 34px; z-index: 1;\n  border-radius: 50%; transform: translate(-50%,-50%) scale(1); opacity: 0; pointer-events: none; will-change: transform, opacity;\n  background: radial-gradient(circle, #fffdf0 0%, rgba(255,250,214,.92) 38%, rgba(216,183,19,.55) 68%, rgba(216,183,19,0) 100%);\n  animation: arr-flood 800ms cubic-bezier(.5,.05,.3,1) 1450ms both, arr-flood-out 650ms ease 2300ms forwards; }\n@keyframes arr-flood { 0% { transform: translate(-50%,-50%) scale(1); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(85); opacity: 1; } }\n@keyframes arr-flood-out { from { opacity: 1; } to { opacity: 0; } }\n.splash-ver { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 2;\n  text-align: center; font-family: var(--font-text); font-size: 11px; font-weight: 600; letter-spacing: .05em;\n  color: #a7a494; opacity: .7; }\n/* -- dormant zoom style (kept for the alternate) -- */\n#splash.zoom { transition: opacity .5s ease .2s; }\n#splash.zoom .hero-mark { transform-origin: center center; will-change: transform;\n  transition: transform .7s cubic-bezier(.5,.05,.2,1); }\n\n/* THE FORMATION: session-end's refill grammar as the cold-open (photo's beat ->\n   anchor -> world -> whisper last), app selectors. Quiet pops, 300ms, 4px rise. */\nbody.arriving .home-atmo .atmo-photo { transition-duration: 600ms !important; }\nbody.arriving .home-atmo .atmo-photo, body.arriving .topbar, body.arriving .trip,\nbody.arriving .scores, body.arriving .empty-hero, body.arriving .hero-tile, body.arriving .practice,\nbody.arriving .home-diverge, body.arriving .whisper, body.arriving .presence, body.arriving #tabbar {\n  opacity: 0; transform: translateY(4px);\n  transition: opacity 300ms cubic-bezier(.2,.7,.3,1), transform 300ms cubic-bezier(.2,.7,.3,1); }\nbody.arriving .arr-in:not(.atmo-ground) { opacity: 1 !important; transform: none !important; }\n/* the floating nav centers via translateX(-50%): its formation is OPACITY-ONLY, like the\n   ceremony's (a translateY would shear the centering and beach the pill half off-screen) */\nbody.arriving #tabbar { transform: translateX(-50%); }\nbody.arriving #tabbar.arr-in { transform: translateX(-50%) !important; }\n/* THE CANDLE: home's corner glow ignites over 1.8s [tune] \u2014 OPACITY ONLY, one curve\n   (light turns on; it never travels on). Degrades to nothing if the ground is absent. */\nbody.arriving .home-atmo .atmo-ground { opacity: 0; }\nbody.arriving .home-atmo .atmo-ground.arr-in { animation: ground-ignite 1800ms cubic-bezier(.45,.05,.3,.95) both; opacity: 1; }\n@keyframes ground-ignite { from { opacity: 0; } to { opacity: 1; } }\n@media (prefers-reduced-motion: reduce) {\n  #splash .splash-stack, .splash-lh, .splash-wm, .splash-flood, #splash .daybreak { animation: none !important; }\n  .splash-lh, .splash-wm { opacity: 1; }\n  .splash-flood { display: none; }\n  #splash .daybreak { opacity: 1; }\n  body.arriving .home-atmo .atmo-photo, body.arriving .topbar, body.arriving .trip,\n  body.arriving .scores, body.arriving .empty-hero, body.arriving .hero-tile, body.arriving .practice,\n  body.arriving .home-diverge, body.arriving .whisper, body.arriving .presence, body.arriving #tabbar,\n  body.arriving .home-atmo .atmo-ground { opacity: 1; transform: none; transition: none; animation: none !important; }\n}\n.icon-btn { background: none; border: none; cursor: pointer; color: var(--text-dim); padding: 4px; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }\n.icon-btn:active { transform: translateY(1px); }\n\n* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\nhtml, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }\n/* atmosphere ground: gradient in dark (via --ground), cream fallback in light; fixed = stable ground while scrolling */\n/* keep the native rubber-band (feedback, not ambient animation) but contain it so a drag-down can't\n   fire the browser's pull-to-refresh (decisions 2026-07-16). `none` killed the bounce \u2192 felt frozen. */\n/* the app pans vertically only \u2014 but the sideways CLIP must live on #app, never on html/body:\n   an overflow-x rule on the page root silently breaks position:sticky on iOS Safari (the topbar\n   scrolled away with the veil on every scrolling tab \u2014 Tom, 2026-07-28). touch-action pan-y is\n   what actually stops the finger; #app's clip catches real layout overflow. */\nmain#app { overflow-x: clip; }\nbody { font-variant-ligatures: no-common-ligatures;   /* the fi ligature eats the i's dot (\"wifi\") \u2014 learners need to SEE letters */\n  overscroll-behavior-x: none;\n  touch-action: pan-y pinch-zoom;   /* fingers pan vertically only \u2014 the native feel */\n  max-width: 480px; margin: 0 auto; min-height: 100vh; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; background: var(--ground, var(--bg)); background-attachment: fixed; }\n/* font law (constitution: buttons don't inherit fonts \u2014 every tappable sets font-family).\n   The 16 classes the conformance lint's first run caught, fixed as one sweep (chat ruling\n   2026-07-23): .tab had been rendering its labels in Arial since the tab bar was built. */\n.close-btn, .mic-btn, .corr-audio, .ring-card, .practice-opt, .toggle, .pill, .pb-kw, .pb-save,\n.pb-thread-back, .pb-group, .chip, .confirm-ghost, .ac-speaker, .tab, .linkbtn { font-family: var(--font-display); }\n/* frosted translucent surfaces over the ground (dark only \u2014 --card-blur is unset in light) */\n.tile, .sheet, .quest, .prog-row, .prog-tier, .prog-trend, .home-diverge, .sheet-diverge, .archive-row, .pb-thread, .culture-note, .backup-banner, #tabbar { backdrop-filter: var(--card-blur, none); -webkit-backdrop-filter: var(--card-blur, none); }\n\n.hidden { display: none !important; }\n\n/* ============ component vocabulary (prefer these on new screens) ============ */\n/* shared \"card\" surface \u2014 one definition drives every panel/row */\n.card, .lesson, .onb-card, .set-row, .reward, .score, .group-code, .member {\n  background: var(--bg-card); border: 1px solid var(--border);\n}\n.card { border-radius: var(--radius-md); padding: var(--space-4); }\n.screen, .settings { padding: var(--space-2) 20px 60px; } /* full-page screen wrapper */\n.pill {                                                 /* small rounded action chip */\n  background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-dim);\n  border-radius: 99px; padding: 7px 14px; font-weight: 700; font-size: var(--text-xs); cursor: pointer;\n}\n.pill:active { transform: translateY(1px); }\n\n/* ---------- Sprint 2 intro ladder: the Grasp word + the Variation frame-mount ---------- */\n.grasp-word { font-family: var(--font-display); font-size: 30px; font-weight: 700; margin: 8px 0 10px; }\n.frame-mount { font-family: var(--font-display); font-size: 23px; font-weight: 600; margin: 14px 0 18px; line-height: 1.5; }\n.frame-mount .slot { display: inline-block; min-width: 84px; text-align: center; border-bottom: 2px solid var(--accent); padding: 0 6px; }\n.frame-mount .slot .dashes { color: var(--text-dim); letter-spacing: 2px; }\n.frame-mount .slot .filled { color: var(--text); animation: qfade 200ms ease both; }   /* the WORD stays text-color; the LINE speaks (Tom, 2026-08-02) */\n.frame-mount .slot:has(.filled) { border-bottom-color: var(--green); }                   /* settled = SOLID green line, always -\n   green is success and never dilutes (Tom: dotted green read as \"semi-correct\"); the\n   new-mark's dotted gold lives on tray tiles and unsettled contexts only */\n.frame-mount .slot .filled.new-mark { border-bottom: none; padding-bottom: 0; }          /* no double underline inside the slot */\n.var-tray { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }\n.var-tray.recede { opacity: .28; transition: opacity 300ms; pointer-events: none; }   /* supply rule */\n/* the cue grammar (ladder-beats r1): micro-caps label + meaning at content scale */\n.cue-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--text-dim); margin: 2px 0 3px; }\n.cue-meaning { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }\n.vtile.vwrong, .word.vwrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }\n/* the machine drills (Sprint 2 increment 4): forge + conveyor + exchange */\n.machine-stage { margin-top: 4px; }\n.conv-cuewrap { min-height: 10px; }\n.conv-dots { display: flex; gap: 6px; margin: 2px 0 10px; }\n.conv-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--bg-elevated); }\n.conv-dots i.now { background: var(--accent); }\n.conv-dots i.done { background: var(--green); }\n.frame-mount .slot.opening { animation: slot-open 200ms cubic-bezier(.2,.7,.3,1) both; transform-origin: left; }\n@keyframes slot-open { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }\n.word.lkey { min-width: 40px; padding: 10px 12px; }\n.forge-answer { min-height: 44px; }\n.exch-ask { font-size: 19px; margin: 2px 0 12px; }\n/* the machine's cue reads at PROMPT scale \u2014 it is the thing you translate (Tom, 2026-08-02;\n   cue-grammar delta flagged to chat: conveyor/forge cues outrank the 17px content scale) */\n.conv-cuewrap .cue-meaning { font-family: var(--font-display); font-size: 23px; font-weight: 700; line-height: 1.3; }\n/* THE NEW-MARK (chat ruling 2026-08-02): first-meeting words settle in (the formation's\n   quiet rise) + speak once, then wear DOTTED gold (never confusable with the slot's solid\n   gold) with tap-to-check until first successful production */\n.new-mark { border-bottom: 2px dotted var(--accent); padding-bottom: 1px; }\n.settle-pop { animation: settle-pop 300ms cubic-bezier(.2,.7,.3,1) both; }\n@keyframes settle-pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }\n.machine-explain { font-size: 14px; color: var(--text-dim); line-height: 1.45; margin: 2px 0 10px; }\n.present-es .pm-slot { color: var(--text-dim); letter-spacing: 1.5px; }   /* the empty mouth of the machine, dim not gold (nothing to tap yet) */\n.gloss-chip { position: absolute; transform: translateY(-34px); background: var(--bg-elevated); border: 1px solid var(--border);\n  border-radius: 9px; padding: 4px 9px; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; box-shadow: var(--shadow); }\n.frame-mount .slot { position: relative; }\n/* idle waveform bars read as stray dots beside settled words (Tom 2026-08-03): matched and\n   settled cards hide them at rest, show them only while playing. Delta flagged for the\n   pairs + sound-choice artifacts. */\n.pcard.matched .pbars, .sc-card.settled .pbars, .sc-card.settled .ac-bars { display: none; }\n.pcard.matched.playing .pbars, .sc-card.settled.playing .pbars, .sc-card.settled.playing .ac-bars { display: inline-flex; }\n@media (prefers-reduced-motion: reduce) { .settle-pop { animation: none; } }\n/* THE FLIGHT (machine-family r6, D5): measured transit between two true states;\n   nothing hand-styled survives a landing */\n.listen-stage.frozen { overflow: hidden; transition: height 240ms cubic-bezier(.2,.7,.3,1) 120ms; }\n.flying { position: absolute; z-index: 30; transition: transform 420ms cubic-bezier(.3,.6,.25,1); margin: 0; }\n@media (prefers-reduced-motion: reduce) { .flying { transition: none; } .listen-stage.frozen { transition: none; } }\n/* phase breath for in-beat handoffs (forge -> conveyor, stage -> played-line) */\n.phase-out { opacity: 0 !important; transition: opacity 250ms ease; }\n.phase-in { animation: qfade 380ms cubic-bezier(.2,.7,.3,1) both; }\n@media (prefers-reduced-motion: reduce) { .phase-in { animation: none; } }\n@media (prefers-reduced-motion: reduce) { .frame-mount .slot.opening { animation: none; } }\n.word.dim { opacity: .4; pointer-events: none; }   /* the tapped wrong tile recedes (mirrors .opt.dim) */\n.lap-chip { color: var(--text-dim); }                              /* the encore's opening line, quiet */\n/* the climbed conveyor types INTO the slot: the input is invisible - no box, no border -\n   the letters land on the slot's own gold underline at frame scale (Tom, 2026-08-03: the\n   boxed .text-input is the STANDALONE typing pattern; in a sentence, the input IS the slot) */\n.frame-mount .slot .slot-input {\n  background: transparent; border: none; box-shadow: none; border-radius: 0; outline: none;\n  font-family: var(--font-display); font-size: inherit; font-weight: inherit; color: var(--text);\n  width: 120px; padding: 0 2px; text-align: center; caret-color: var(--accent);\n}\n.frame-mount .slot:has(.slot-input.vwrong) { border-bottom-color: var(--red); }   /* the LINE flags the miss, briefly */\n\n/* ---------- top bar ---------- */\n.topbar {\n  position: sticky; top: 0; z-index: 10;\n  display: flex; align-items: center; gap: 9px;\n  padding: calc(14px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 8px calc(24px + env(safe-area-inset-left));\n  /* the veil (header-beyond-home): eased 4-stop, no hard cutoff \u2014 the OLED lesson applied preemptively */\n  background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 55%, transparent) 82%, transparent 100%);\n}\n/* runners wear NO topbar: the field is identity, the runner owns its chrome (the\n   double-chrome reconciliation \u2014 the old \"runners don't render it\" contract line was\n   documentation, not code, until now) */\nbody.in-runner .topbar { display: none; }\n/* language flag sits just left of the gear (mirrors the flame\u2192profile spacing) */\n/* \u00a73.2 language indicator (design/home.html .lang): a small text chip, not the flag emoji */\n.topbar .lang-flag-top { font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--text-dim);\n  border: 1px solid var(--border); background: var(--bg-card); border-radius: 12px; padding: 4px 9px;\n  cursor: pointer; display: none; align-items: center; justify-content: center; }   /* chip is HOME-ONLY (Tom's verdict) */\nbody.home-lit .topbar .lang-flag-top { display: inline-flex; }\nbody.home-lit .topbar .lang-flag-top { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: #fff; }\n/* \u00a73.2 header flame (design/home.html .flame): gold, display font \u2014 \"gold is the app's light\" */\n.stat { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 600; font-size: 13px; }\n.stat .ic.flame { display: inline-flex; }\n.stat.streak { color: var(--accent-2); margin-left: auto; }\n.stat.streak.swell { animation: flame-swell 1.8s cubic-bezier(.2,.7,.3,1) both; transform-origin: center; }\n@keyframes flame-swell { 0% { transform: scale(1); } 25% { transform: scale(1.45); } 55% { transform: scale(1.45); } 100% { transform: scale(1); } }\n@media (prefers-reduced-motion: reduce) { .stat.streak.swell { animation: none; } }   /* pushes flame + lang into the right group */\n.stat.xp { color: var(--green); }\n.stat.gems { color: var(--secondary); }\n.topbar .spacer { flex: 1; }\n/* \u00a73.2 header (design/home.html .approw), app-wide: wordmark LEFT, flame + lang grouped RIGHT */\n.topbar-brand {\n  order: -1; display: flex; align-items: center; gap: 5px;\n}\n.topbar-brand .wordmark { height: 19px; }\n\n/* ---------- home / map ---------- */\n.home { padding: 8px 24px 104px; position: relative; z-index: 1; }\n/* home is a one-screen composition (design .screen) with nothing to scroll to \u2014 but keep the native\n   rubber-band so it doesn't read as a frozen web page. Force a 1px overflow so iOS engages the bounce\n   even when content fits (imperceptible; no real scroll). Body's overscroll-behavior-y:contain stops\n   pull-to-refresh. Retires when the Capacitor WKWebView bounce is used (decisions 2026-07-16). */\nbody.home-lit { min-height: calc(100vh + 1px); }\n\n/* \u00a73.2 home atmosphere: a destination photo crowns the top and MASKS into the ground (mask-don't-paint),\n   with a warm destination ground-glow beneath it. Fixed layer behind the content (torn down off-home). */\n.home-atmo { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100%; z-index: 0; pointer-events: none; }\n.home-atmo .atmo-ground { position: absolute; inset: 0;\n  background: radial-gradient(190% 170% at -14% 116%, color-mix(in srgb, #c96a2b 40%, transparent) 0%, color-mix(in srgb, #e0952b 24%, transparent) 30%, color-mix(in srgb, var(--accent) 14%, transparent) 55%, color-mix(in srgb, var(--accent) 6%, transparent) 76%, transparent 94%); }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .home-atmo .atmo-ground {\n  background: radial-gradient(185% 165% at -14% 116%, rgba(201,106,43,.32) 0%, rgba(230,198,42,.12) 40%, rgba(230,198,42,.05) 68%, transparent 94%); } }\n:root[data-theme=\"dark\"] .home-atmo .atmo-ground {\n  background: radial-gradient(185% 165% at -14% 116%, rgba(201,106,43,.32) 0%, rgba(230,198,42,.12) 40%, rgba(230,198,42,.05) 68%, transparent 94%); }\n/* extend the crown by the status-bar inset: with black-translucent the photo reaches under the status\n   bar (top:0) but the content is pushed down by the safe area, so add it back or the blend lands above the dials */\n.home-atmo .atmo-photo { position: absolute; top: 0; left: 0; right: 0; height: calc(264px + env(safe-area-inset-top)); }\n.home-atmo .atmo-photo img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.72) brightness(.82) contrast(.95);\n  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 26%, rgba(0,0,0,.5) 58%, transparent 96%);\n          mask-image: linear-gradient(180deg, #000 0%, #000 26%, rgba(0,0,0,.5) 58%, transparent 96%); }\n.home-atmo .atmo-photo::after { content: \"\"; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 34%); }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .home-atmo .atmo-photo img { filter: saturate(.6) brightness(.55) contrast(1.02); } }\n:root[data-theme=\"dark\"] .home-atmo .atmo-photo img { filter: saturate(.6) brightness(.55) contrast(1.02); }\n\n/* \u00a73.2 trip header \u2014 destination name anchors over the photo, subline is pure countdown */\n/* trip header \u2014 matches the re-mocked 390px artifact (dest 28px; the ~12% scale-up lives in the dials). */\n.trip { margin: 4px 0 20px; }\n.trip .dest { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }\n.trip .sub { font-size: 14px; color: var(--text-dim); margin-top: 3px; }\n\n/* photo-on (\u00a72.1 halo rule): header over the photo \u2014 transparent topbar, wordmark halo forcing the\n   standard brand colors in both themes, white header text with a soft shadow for legibility. */\nbody.home-lit .topbar { background: transparent; }\nbody.home-lit .topbar-brand { --wordmark-1: #1c275e; --wordmark-2: #4a7fc1; }\nbody.home-lit .topbar-brand .wordmark { filter: drop-shadow(0 0 5px rgba(255,255,255,.92)) drop-shadow(0 0 14px rgba(255,255,255,.6)); }\nbody.home-lit .stat.streak { color: #f0d060; text-shadow: 0 1px 6px rgba(0,0,0,.5); }   /* design .photo-on .flame */\nbody.home-lit .trip .dest { color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.55); }\nbody.home-lit .trip .sub { color: rgba(255,255,255,.9); text-shadow: 0 1px 6px rgba(0,0,0,.5); }\n.hero h1 { font-size: 26px; margin: 6px 0 2px; }\n.hero p { color: var(--text-dim); margin: 0 0 18px; font-size: 14px; }\n\n.stage { margin: 26px 0 8px; }\n.stage-head { display: flex; align-items: baseline; gap: 10px; }\n.stage-head h2 { font-size: 19px; margin: 0; }\n.stage-head .blurb { color: var(--text-dim); font-size: 13px; }\n.stage-bar {\n  height: 8px; background: var(--bg-elevated); border-radius: 99px;\n  margin: 10px 0 18px; overflow: hidden;\n}\n.stage-bar > i { display:block; height:100%; background: linear-gradient(90deg,var(--green),var(--accent-2)); border-radius:99px; transition: width .5s; }\n\n.lessons { display: flex; flex-direction: column; gap: 14px; }\n.lesson {\n  display: flex; align-items: center; gap: 14px;\n  border-radius: var(--radius); padding: 14px 16px; cursor: pointer;\n  transition: transform .08s;\n}\n.lesson:active { transform: translateY(2px); }\n.lesson .badge {\n  width: 48px; height: 48px; border-radius: 50%;\n  display: grid; place-items: center; font-size: 22px; flex: none;\n  background: var(--bg-elevated); border: 2px solid var(--border);\n}\n.lesson.done .badge { background: var(--green); border-color: var(--green-dark); }\n/* \u00a73.3 strength ring replaces stars \u2014 when the badge holds a ring, drop the filled disc */\n.lesson .badge:has(.ls-ring), .lesson.done .badge:has(.ls-ring) { background: none; border: none; }\n.badge-new { color: var(--text-dim); display: inline-flex; }\n.lesson.locked { opacity: .45; cursor: not-allowed; }\n.lesson .meta { flex: 1; min-width: 0; }\n.lesson .meta .t { font-weight: 800; font-size: 16px; }\n.lesson .meta .s { color: var(--text-dim); font-size: 12px; margin-top: 2px; }\n.lesson .stars { color: var(--accent-2); font-size: 13px; letter-spacing: 1px; }\n.lesson .chev { color: var(--text-dim); font-size: 20px; }\n/* tiered-spiral tiles: tier chip (from pass), review-due badge, recommended marker */\n.tier-chip { display: inline-block; font-size: 11px; font-weight: 700; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; line-height: 1.5; vertical-align: 1px; }\n.tier-chip.p1 { color: var(--green); }\n.tier-chip.p2 { color: var(--secondary); }\n.tier-chip.p3 { color: var(--accent-2); }\n.tier-chip.bonus { color: var(--text-dim); }\n.lesson .fade-badge { color: var(--accent-2); font-weight: 700; }\n.lesson.rec { border-color: var(--secondary); }\n.rec-tag { font-size: 10px; font-weight: 800; color: #fff; background: var(--secondary); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }\n\n/* ---------- lesson runner ---------- */\n.runner { padding: calc(16px + env(safe-area-inset-top)) 18px 40px; }   /* rail-shed (v204): the runner is\n  now the topmost element, so it carries the safe-area inset itself \u2014 the progress row\n  must clear the dynamic island / notch */\n.progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }\n.dev-nav { display: inline-flex; gap: 2px; margin-left: auto; }\n.dev-nav button { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); min-width: 34px; min-height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }\n.close-btn { background: none; border: none; color: var(--text-dim); font-size: 26px; cursor: pointer; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }\n.pbar { flex: 1; height: 4px; background: var(--bg-elevated); border-radius: 99px; overflow: hidden; }   /* thin hairline per design/correct-feedback.html */\n.pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.34,1.42,.5,1); }   /* \u00a78.3 spring overshoot; gold = progress (green stays reserved for \"correct\"), per design/correct-feedback.html */\n\n.retry-chip {\n  display: inline-block; margin: 0 0 12px; padding: 6px 12px; border-radius: 999px;\n  background: color-mix(in srgb, var(--accent-2) 15%, var(--bg)); color: var(--accent-2);\n  border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent);\n  font-size: 13px; font-weight: 800;\n}\n.qtype { color: var(--text-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }\n.prompt { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 8px 0 6px; line-height: 1.25; }   /* display text wears the display font, en prompts included (Tom, 2026-07-21) */\n.prompt-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 18px; }\n.effort-line { background: color-mix(in srgb, var(--secondary) 12%, transparent); border: 1px solid var(--secondary); color: var(--secondary); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; line-height: 1.4; margin: 10px 0 16px; }\n/* presentation card \u2014 first sight of a new phrase (teach, not test) */\n/* gold display label \u2014 matches design/presentation-card.html .new-label (and the correction sheet's .corr-label) */\n.present-label { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); margin: 4px 0 10px; }\n/* no card box: the design sits the words directly on the screen (the chunk pills carry their own fills) */\n.present-card { margin: 8px 0 16px; }\n.present-es { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.25; color: var(--text); }\n.present-en { font-size: 16px; color: var(--text-dim); margin-top: 8px; }\n.present-note { font-size: 13px; color: var(--secondary); margin-top: 12px; line-height: 1.4; }\n.present-ctx { font-size: 15px; color: var(--text-dim); margin-top: 12px; line-height: 1.5; }\n.present-ctx .es { color: var(--text); font-family: var(--font-display); font-weight: 500; cursor: pointer; border-bottom: 1px dotted var(--text-dim); }\n.present-ctx .es.playing { color: var(--accent-2); border-bottom-color: var(--accent-2); }\n/* anchor: \"Think:\" lead, same treatment as the correction sheet's .corr-anchor (bulb chip retired) */\n.present-anchor { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-top: 12px; }\n.present-anchor .lead { color: var(--accent-2); font-weight: 500; }\n/* \u00a74b.5 segmented chunk card \u2014 one new piece gold + NEW tag, known pieces unmarked. Same pill treatment\n   as design/correction-sheet.html (.corr-chunk / .corr-chunk.error) so the two cards read identically. */\n.present-card.chunked { position: relative; }\n/* unified chunk semantics (decisions 2026-07-16): known chunks = flowing text with the dotted hint\n   underline (same affordance as the exercise hint layer); only the NEW piece is a gold box. */\n.chunk-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }\n.chunk-pill { background: none; border: 0; border-bottom: 1.5px dotted var(--text-dim); border-radius: 0;\n  padding: 0 0 2px; font-family: var(--font-display); font-size: 21px; font-weight: 500; color: var(--text);\n  line-height: 1.35; cursor: pointer; user-select: none;\n  transition: color var(--transition), border-color var(--transition); }\n.chunk-pill:active, .chunk-pill.playing { color: var(--accent-2); border-bottom-color: var(--accent-2); }\n.chunk-pill.new { background: color-mix(in srgb, var(--accent) 14%, var(--bg-card));\n  border: 1px solid var(--accent-2); border-radius: var(--radius-sm); padding: 9px 13px; line-height: 1.25;\n  transition: transform var(--transition), box-shadow var(--transition); }\n.chunk-pill.new:active { transform: scale(0.97); color: var(--text); }\n.chunk-pill.new.playing { color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }\n.chunk-pill .cp-tag { font-family: var(--font-display); font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--accent-2); margin-left: 6px; vertical-align: 2px; }\n.present-card.chunked .present-en { margin-top: 14px; font-size: 16px; }\n.present-pop { position: absolute; background: var(--primary); color: #fff; font-size: 12.5px; padding: 7px 11px; border-radius: var(--radius-sm);\n  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--transition), transform var(--transition); white-space: nowrap; z-index: 10; }\n.present-pop.show { opacity: 1; transform: translateY(0); }\n/* audio row: 44px speaker + inline hint, matching the artifact's AudioControl composition */\n.present-audio { display: flex; align-items: center; gap: 12px; margin: 16px 0; }\n.present-audio .audio-hint { font-size: var(--text-xs); color: var(--text-dim); }\n/* \u00a74c.1 v2.1 active dismissal: two-soft-option meaning check on the new material (replaces \"Got it\") */\n.microrep { font-size: var(--text-sm); color: var(--text-dim); line-height: 1.5; min-height: 44px; display: flex; align-items: center; gap: 8px; margin-top: 8px; }\n.microrep .q { color: var(--text); font-weight: 500; }\n.opts { display: flex; gap: 8px; margin-top: 4px; }\n.opt { flex: 1; border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-md); padding: 12px;\n  font-family: var(--font-display); font-size: 15px; font-weight: 500; color: var(--text); cursor: pointer; min-height: 48px; text-align: center;\n  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition), background var(--transition); }\n.opt:active { transform: translateY(1px); }\n.opt.got { border-color: var(--green); background: color-mix(in srgb, var(--green) 8%, var(--bg-card)); }\n.opt.hinted { border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }\n.opt.dim { opacity: 0.45; color: var(--text-dim); pointer-events: none; }   /* the tapped wrong option recedes */\n/* intro page \u2014 all the section's new phrases at once */\n/* full-bleed regional photo card (one phrase at a time, Oura-style) */\n.intro-photo {\n  position: relative; margin: -16px -18px 0; min-height: 66vh;\n  background-size: cover; background-position: center; background-color: var(--bg-elevated);\n  display: flex; align-items: flex-end; overflow: hidden;\n}\n.intro-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.35) 62%, rgba(0,0,0,.82) 100%); }\n.intro-fg { position: relative; padding: 22px 20px 24px; color: #fff; width: 100%; }\n.intro-count { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; opacity: .85; margin-bottom: 10px; }\n.intro-es-big { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.15; text-shadow: 0 1px 12px rgba(0,0,0,.4); }\n.intro-en-big { font-size: 17px; margin-top: 8px; opacity: .95; text-shadow: 0 1px 10px rgba(0,0,0,.4); }\n.intro-note-big { font-size: 13px; margin-top: 10px; opacity: .88; line-height: 1.4; }\n.intro-hear { margin: 14px 0 0; background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); color: #fff; backdrop-filter: blur(4px); }\n/* compact side-by-side nav for the intro flow (Back small on the left, Next primary) */\n.intro-nav { display: flex; align-items: center; gap: 10px; }\n.intro-nav .btn { margin: 0; width: auto; }\n.intro-nav #iback { flex: 0 0 auto; padding: 12px 18px; }\n.intro-nav #inext, .intro-nav #istart { flex: 1; }\n.intro-nav .nav-gap { flex: 0 0 auto; }\n\n/* \u00a74c.4 scenario primer \u2014 scene (photo banner + text) \u2192 guess \u2192 reveal */\n.primer-photo { margin: calc(-16px - env(safe-area-inset-top)) -18px 20px; height: calc(40vh + env(safe-area-inset-top)); background-size: cover; background-position: center; background-color: var(--bg-elevated); border-radius: 0 0 22px 22px; }\n.primer-fg { padding-bottom: 100px; }\n.primer-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); margin-bottom: 12px; }\n.primer-label.ok { color: var(--green); }\n.primer-scene { font-family: var(--font-display); font-size: 22px; line-height: 1.4; }\n.primer-mission { margin-top: 16px; font-size: 15px; line-height: 1.5; color: var(--text-dim); }\n.primer-mission b { color: var(--accent); font-weight: 800; margin-right: 5px; }\n.primer-body { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-height: 60vh; justify-content: center; }\n.primer-guess-es { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.2; }\n.primer-guess-es.big { font-size: 34px; }\n.primer-body .qtype { margin: 8px 0 4px; }\n.primer-body .choices { width: 100%; margin-top: 8px; }\n.primer-en { font-size: 18px; color: var(--text-dim); margin-top: 4px; }\n.primer-anchor { margin-top: 18px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--secondary); }\n\n.intro-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 8px; }\n.intro-row {\n  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;\n  background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--accent-2);\n  border-radius: var(--radius-md); padding: 12px 14px;\n}\n.intro-txt { flex: 1; min-width: 0; }\n.intro-es { font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.25; }\n.intro-en { font-size: 14px; color: var(--text-dim); margin-top: 2px; }\n.intro-note { font-size: 12px; color: var(--secondary); margin-top: 5px; line-height: 1.35; }\n/* ---- AudioControl (\u00a73.2), built to design/audio-control.html ---- */\n.ac-group { display: inline-flex; align-items: center; }\n.ac-speaker { width: 44px; height: 44px; min-width: 44px; padding: 0; border-radius: 50%;\n  border: 1px solid var(--border); background: var(--bg-card); color: var(--accent-2); box-shadow: var(--shadow);\n  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;\n  transition: transform var(--transition), box-shadow var(--transition); }\n.ac-speaker:active { transform: translateY(2px); box-shadow: var(--shadow-press); }   /* \u00a72.1 push-down (token, not the artifact's hardcoded light shadow) */\n.ac-bars { display: none; align-items: flex-end; gap: 2.5px; height: 16px; }\n.ac-bars span { width: 3px; background: var(--accent-2); border-radius: 1.5px; animation: acbar 900ms ease-in-out infinite; }\n.ac-bars span:nth-child(1) { height: 7px;  animation-delay: 0ms; }\n.ac-bars span:nth-child(2) { height: 14px; animation-delay: 150ms; }\n.ac-bars span:nth-child(3) { height: 10px; animation-delay: 300ms; }\n.ac-bars span:nth-child(4) { height: 15px; animation-delay: 450ms; }\n@keyframes acbar { 0%,100% { transform: scaleY(0.55); } 50% { transform: scaleY(1); } }\n.ac-speaker.playing .ac-glyph { display: none; }\n.ac-speaker.playing .ac-bars { display: inline-flex; }\n.ac-speed { height: 30px; margin-left: 8px; padding: 0 11px; border-radius: 15px;\n  border: 1px solid var(--border); background: var(--bg-elevated);\n  font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--text-dim);\n  cursor: pointer; transition: background var(--transition), color var(--transition), border-color var(--transition);\n  display: inline-flex; align-items: center; gap: 4px; min-width: 44px; justify-content: center; }\n.ac-speed.slowed { background: var(--bg-card); color: var(--accent-2); border-color: var(--accent-2); }\n/* playing ring only on the boxed attend-here chunks (new piece / error chunk); text chunks go gold-underline */\n.chunk-pill.new.playing, .corr-chunk.error.playing { border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }\n@media (prefers-reduced-motion: reduce) { .ac-bars span { animation: none; } }\n\n/* choices */\n.choices { display: flex; flex-direction: column; gap: 12px; }\n.choice {\n  text-align: left; background: var(--bg-card); border: 2px solid var(--border);\n  color: var(--text); border-radius: var(--radius); padding: 14px 16px; font-size: 15px;\n  font-family: var(--font-display);       /* buttons don't inherit font (same fix as .btn) */\n  font-weight: 500; min-height: 48px;     /* variants artifact .opt: 15/500, 48px target */\n  cursor: pointer; box-shadow: var(--shadow); transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s,\n    opacity 300ms cubic-bezier(.2,.7,.3,1), border-color 300ms, background 300ms;   /* option settle 300ms [tune], Sprint 2 ruling 1 */\n}\n.choice:active { transform: translateY(2px); box-shadow: var(--shadow-press); }   /* \u00a72.1 push-down */\n.choice.correct { border-color: var(--green); background: color-mix(in srgb, var(--green) 15%, transparent); }\n.choice.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }\n.choice.dim { opacity: .4; }\n\n/* match grid */\n.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n.match .tile {\n  background: var(--bg-card); border: 2px solid var(--border); color: var(--text);\n  border-radius: 12px; padding: 14px 10px; font-weight: 700; cursor: pointer; font-size: 15px;\n  transition: transform .12s cubic-bezier(.34,1.56,.64,1), border-color .12s, background .12s;\n}\n.match .tile:active { transform: translateY(2px); }\n.match .tile.sel { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent) 16%, transparent); }\n.match .tile.gone { opacity: 0; pointer-events: none; transition: opacity .3s; }\n.match .tile.bad { border-color: var(--red); animation: shake .3s; }\n/* M4 speed round + listen 0.75\u00d7 toggle */\n.speed-timer { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; }\n.speed-score { font-weight: 800; font-size: 18px; color: var(--green); min-width: 28px; text-align: right; }\n@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }\n\n/* \u00a78.3 each question springs in \u2014 continuous motion is most of \"feels alive\" */\n/* THE SLIDE (Sprint 2 ruling 2): the work travels across the still field \u2014 in from the\n   right on the system curve; horizontal is the lesson's progress axis.\n   [tune] 2026-07-29 (Tom, final): FULL page travel, EQUAL halves \u2014 400ms out, 400ms in\n   (Tom A/B'd 450/500, \u00b110/15/20%; symmetric 400/400 won). No fade needed; the field visibly\n   still beneath both. #app's overflow-x clip (v214) keeps the off-stage halves from widening\n   the page. */\n#qbody.qenter { animation: qenter 350ms cubic-bezier(.2,.7,.3,1) both; }   /* [tune] 400 -> 350 (Tom, 2026-08-03) */\n@keyframes qenter { from { transform: translateX(110%); } to { transform: none; } }\n/* \u00a78.3 wrong answer \u2014 restrained iOS-passcode shake, no red splash */\n.shake-x { animation: shake .34s; }\n/* reduced motion: the slide becomes a crossfade \u2014 no travel (Sprint 2 ruling 2) */\n@media (prefers-reduced-motion: reduce) {\n  #qbody.qenter { animation: qfade 200ms ease both; }\n  #qbody.leaving { transform: none; }\n  .shake-x, .pbar > i { animation: none; transition: none; }\n}\n@keyframes qfade { from { opacity: 0; } to { opacity: 1; } }\n\n/* \u00a78.3 correct check that draws itself in (~200ms), paired with the success haptic */\n.draw-check { width: 20px; height: 20px; flex: none; vertical-align: -4px; }\n.draw-check path { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 26; stroke-dashoffset: 26; animation: drawcheck .22s ease-out .04s forwards; }\n@keyframes drawcheck { to { stroke-dashoffset: 0; } }\n\n/* \u00a78.4 \"Restored\" moment \u2014 a fading phrase brought back; a small strength arc fills as proof */\n.restored-chip { display: inline-flex; align-items: center; gap: 8px; margin: 2px 0 12px;\n  padding: 6px 12px 6px 8px; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--accent-2);\n  background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); }\n.restored-ring { width: 18px; height: 18px; flex: none; transform: rotate(-90deg); }\n.restored-ring .rr-bg { fill: none; stroke: color-mix(in srgb, var(--accent-2) 25%, transparent); stroke-width: 4; }\n.restored-ring .rr-fg { fill: none; stroke: var(--accent-2); stroke-width: 4; stroke-linecap: round;\n  stroke-dasharray: 94.2; stroke-dashoffset: 94.2; animation: fillarc .5s cubic-bezier(.3,.7,.3,1) .05s forwards; }\n@keyframes fillarc { to { stroke-dashoffset: 14; } }   /* fills ~85% of the ring */\n\n/* \u00a78.3 ambient scenario tint \u2014 barely-there gradient keyed to category, gives a sense of place */\n.runner { position: relative; }\n.runner::before { content: \"\"; position: absolute; inset: -16px -18px auto; height: 240px; z-index: -1;\n  background: radial-gradient(120% 80% at 50% 0%, var(--scene-tint, transparent) 0%, transparent 70%); pointer-events: none; }\n.runner.scene-food       { --scene-tint: color-mix(in srgb, #e0952a 12%, transparent); }\n.runner.scene-transit    { --scene-tint: color-mix(in srgb, #4a7fc1 12%, transparent); }\n.runner.scene-directions { --scene-tint: color-mix(in srgb, #2f9e57 11%, transparent); }\n.runner.scene-lodging    { --scene-tint: color-mix(in srgb, #8a6dc1 12%, transparent); }\n.runner.scene-sights     { --scene-tint: color-mix(in srgb, #d8b713 12%, transparent); }\n.runner.scene-numbers    { --scene-tint: color-mix(in srgb, #4aa6b0 11%, transparent); }\n.runner.scene-advanced   { --scene-tint: color-mix(in srgb, #c1566a 11%, transparent); }\n.runner.scene-basics     { --scene-tint: color-mix(in srgb, var(--secondary) 10%, transparent); }\n\n/* build (tap to assemble) */\n.build-answer {\n  min-height: 56px; border-bottom: 2px dashed var(--border); margin-bottom: 18px;\n  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding-bottom: 10px;\n}\n.bank { display: flex; flex-wrap: wrap; gap: 10px; }\n.word {\n  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);\n  border-radius: var(--radius-sm); padding: 8px 12px; font-size: 17px; font-weight: 500;\n  cursor: pointer; box-shadow: var(--shadow);\n  font-family: var(--font-display);       /* buttons don't inherit font (same fix as .btn) */\n  transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s;\n}\n.bank .word { background: var(--bg-elevated); color: var(--text-dim); }   /* tray sits quieter than placed tiles */\n.word:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.word.used { visibility: hidden; }\n/* \u00a71b.4 scaffolded build: pre-placed (locked) chunks + empty slots for the novel words */\n.word.locked { opacity: .5; box-shadow: none; cursor: default; }\n.build-answer .slot {\n  display: inline-flex; align-items: center; justify-content: center; min-width: 52px; min-height: 42px;\n  border: 2px dashed var(--border); border-radius: 12px; padding: 0 10px; font-weight: 700; color: var(--text);\n}\n.build-answer .slot.filled { border-style: solid; border-color: var(--primary); cursor: pointer; }\n/* \u00a74b.2 two-blank fill: inline slots in the sentence */\n.fillslot { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; min-height: 32px; border: 2px dashed var(--border); border-radius: 8px; margin: 0 3px; padding: 0 8px; vertical-align: middle; font-weight: 800; }\n.fillslot.filled { border-style: solid; border-color: var(--primary); cursor: pointer; color: var(--accent-2); }\n\n/* footer / feedback */\n.footer {\n  position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto;\n  padding: 16px 18px calc(16px + env(safe-area-inset-bottom)); background: var(--bg);\n  border-top: 1px solid var(--border);\n}\n/* over the range, the exit zone floats: no black band cutting the mountains (Tom's\n   screenshots, 2026-08-05). The BUTTONS stay opaque (the law); the container clears.\n   Chat owns the exit zone's final grounding treatment - this is the lawful interim. */\nbody.in-runner .footer { background: transparent; border-top: none; }\n.footer.correct { background: color-mix(in srgb, var(--green) 12%, var(--bg)); }\n.footer.wrong { background: color-mix(in srgb, var(--red) 12%, var(--bg)); }\n.fb-title { font-weight: 800; font-size: 17px; margin-bottom: 2px; display: flex; align-items: center; gap: 7px; }\n.fb-title.ok { color: var(--green); } .fb-title.no { color: var(--red); }\n.fb-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }\n/* \u00a7feedback #3: clear separator between the Spanish phrase and its English gloss */\n.fb-sub b { color: var(--text); }\n.fb-en::before { content: \"\u00b7\"; margin: 0 7px; opacity: .5; font-weight: 700; }\n.note-chip { display:inline-block; font-size:12px; margin:2px 6px 0 0; padding:3px 8px; border-radius:8px; background:var(--bg-elevated); color:var(--text-dim); }\n.note-chip b { color: var(--accent-2); }\n\n/* \u00a7feedback #4: inline icons standing in for emoji \u2014 align them on the text baseline */\n.ph { vertical-align: -0.15em; }\n.retry-chip { display: inline-flex; align-items: center; gap: 6px; }\n.primer-anchor { display: inline-flex; align-items: center; gap: 7px; }\n.effort-line { display: flex; align-items: flex-start; gap: 8px; }\n.effort-line .ph { flex: none; margin-top: 1px; }\n\n/* \u00a7feedback #1: present-card nav (Back + Got it) while phrases are being introduced */\n.present-nav { display: flex; align-items: center; gap: 10px; }\n.present-nav .btn { margin: 0; }\n.present-nav #pback { flex: 0 0 auto; width: auto; padding: 12px 18px; display: inline-flex; align-items: center; gap: 4px; }\n.present-nav #got { flex: 1; }\n\n.btn {\n  /* design-system button spec (decisions 2026-07-16): 15/600/radius-md/48min \u2014 the constitution's button */\n  width: 100%; border: none; border-radius: var(--radius-md); padding: 14px; min-height: 48px;\n  font-family: var(--font-display);       /* buttons don't inherit font: without this they fall back to UA Arial */\n  font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow);\n  background: var(--primary); color: #fff;                 /* default = primary */\n  transition: transform var(--transition), box-shadow var(--transition);   /* smooth press, matches the artifact */\n}\n.btn:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.btn--primary { background: var(--primary); color: #fff; }\n.btn--ghost, .btn.grey { background: var(--bg-elevated); color: var(--text); }\n.btn--accent, .btn.accent { background: var(--secondary); color: #fff; }\n.btn--danger { background: var(--red); color: #fff; }\n.btn[disabled] { opacity: .4; cursor: not-allowed; }\n\n/* results / complete */\n.complete { padding: 40px 24px; text-align: center; }\n.complete .big { font-size: 64px; }\n.complete h2 { font-size: 26px; margin: 8px 0; }\n.reward {\n  border-left: 4px solid var(--accent-2);\n  border-radius: 12px; padding: 16px; margin: 20px 0; font-size: 16px; line-height: 1.4; text-align: left;\n}\n/* \u00a79b.4 culture note \u2014 insider texture shown once on lesson completion */\n.culture-note { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 0 0 20px; font-size: 15px; line-height: 1.5; text-align: left; }\n.cn-label { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--accent-2); margin-right: 6px; }\n.scorebar { display: flex; gap: 12px; justify-content: center; margin: 18px 0 28px; }\n.score { border-radius: 12px; padding: 12px 18px; }\n.score .n { font-size: 22px; font-weight: 800; color: var(--accent-2); }\n.score .l { font-size: 12px; color: var(--text-dim); }\n\n/* toast */\n.toast {\n  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);\n  background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);\n  padding: 12px 18px; border-radius: 99px; font-weight: 700; font-size: 14px;\n  opacity: 0; transition: all .3s; z-index: 50; max-width: 90%;\n}\n.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }\n\n/* ---------- streak strip ---------- */\n.streak-strip { margin: 14px 0 4px; }\n.streak-strip > span { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }\n.streak-strip .dots { display: flex; gap: 5px; margin-top: 6px; }\n.streak-strip .dots i { width: 100%; height: 10px; border-radius: 4px; background: var(--bg-elevated); }\n.streak-strip .dots i.hit { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }\n\n/* ---------- onboarding ---------- */\n.onb { padding: 24px 20px 40px; }\n.onb-card { border-radius: var(--radius); padding: 24px; margin-bottom: 22px; }\n/* \u00a75.3 returning-user seam line \u2014 record vs faded state, framed as physics not failure */\n.onb-seam { background: color-mix(in srgb, var(--secondary) 10%, transparent); border: 1px solid color-mix(in srgb, var(--secondary) 35%, transparent);\n  border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.5; color: var(--text); }\n.onb-emoji { font-size: 44px; }\n.onb-card h2 { font-size: 23px; margin: 8px 0 10px; }\n.onb-card p { color: var(--text-dim); line-height: 1.5; margin: 0 0 8px; }\n.onb-dim { font-size: 13px; }\n.onb-q { font-size: 22px; font-weight: 800; margin: 6px 0 4px; }\n.onb-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; }\n.chips { display: flex; flex-direction: column; gap: 12px; }\n.chip { text-align: left; background: var(--bg-card); border: 2px solid var(--border); color: var(--text);\n  border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .06s; }\n.chip:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.chip.on { border-color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }\n.chip .chip-l { display: block; font-weight: 800; font-size: 17px; }\n.chip .chip-d { display: block; color: var(--text-dim); font-size: 13px; margin-top: 3px; }\n\n/* ---------- settings ---------- */\n.set-head { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }\n.set-head h2 { font-size: 22px; margin: 0; }\n.set-head .close-btn { font-size: 34px; }\n.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px;\n  border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }\n.set-t { font-weight: 800; font-size: 16px; }\n.set-d { color: var(--text-dim); font-size: 13px; margin-top: 2px; }\n.soon { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;\n  color: var(--accent-2); background: color-mix(in srgb, var(--accent) 16%, transparent); padding: 5px 9px; border-radius: 8px; white-space: nowrap; }\n.toggle { width: 52px; height: 30px; border-radius: 99px; border: none; background: var(--bg-elevated); cursor: pointer; position: relative; flex: none; transition: background .2s; }\n.toggle i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text-dim); transition: all .2s; }\n.toggle.on { background: var(--primary); }\n.toggle.on i { left: 25px; background: #fff; }\n\n/* ---------- text input (type / listen) ---------- */\n.text-input { width: 100%; background: var(--bg-card); border: 2px solid var(--border); color: var(--text);\n  border-radius: var(--radius); padding: 16px; font-size: 18px; font-weight: 600; outline: none;\n  transition: border-color var(--transition), background-color var(--transition); }   /* \u00a73.5 wash eases in over 160ms, not a snap */\n.text-input:focus { border-color: var(--accent-2); }\n/* date inputs: kill the native iOS control that overflows/clips its box; render as a normal field */\n.text-input[type=\"date\"] { -webkit-appearance: none; appearance: none; min-width: 0; min-height: 56px; line-height: 1.2; }\n.text-input[type=\"date\"]::-webkit-date-and-time-value { text-align: left; margin: 0; }\n.text-input[type=\"date\"]::-webkit-calendar-picker-indicator { margin-left: auto; }\n.big-speak { display: block; margin: 30px auto; width: 96px; height: 96px; border-radius: 50%;\n  background: var(--bg-elevated); border: 2px solid var(--border); color: var(--secondary); font-size: 40px; cursor: pointer; }\n.big-speak:active { transform: translateY(2px); }\n/* M4 speak-it mic */\n.mic-btn { display: block; margin: 26px auto; width: 100px; height: 100px; border-radius: 50%;\n  background: var(--bg-elevated); border: 2px solid var(--border); color: var(--secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .08s; }\n.mic-btn:active { transform: translateY(2px); }\n.mic-btn.live { background: var(--red); border-color: var(--red); color: #fff; animation: micpulse 1s ease-in-out infinite; }\n@keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,88,106,.5); } 50% { box-shadow: 0 0 0 14px rgba(232,88,106,0); } }\n/* M4 chained exchange \u2014 chat-style boss dialogue */\n.chain-title { flex: 1; font-weight: 800; font-size: 15px; text-align: center; margin-right: 24px; }\n.chain-log { display: flex; flex-direction: column; gap: 12px; padding: 14px 2px 30px; }\n.cbub { max-width: 82%; border-radius: 16px; padding: 10px 14px; }\n.cbub-es { font-weight: 700; font-size: 16px; line-height: 1.3; }\n.cbub-en { font-size: 13px; color: var(--text-dim); margin-top: 2px; }\n.cbub.npc { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 5px; }\n.cbub.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 5px; }\n.cbub.user .cbub-en { color: rgba(255,255,255,.72); }\n.chain-you { font-size: 13px; font-weight: 700; color: var(--text-dim); margin-bottom: 10px; }\n.cnarr { align-self: center; text-align: center; max-width: 92%; color: var(--text-dim); font-family: var(--font-display); font-size: 16px; line-height: 1.5; padding: 10px 4px; }\n.blank { display: inline-block; min-width: 60px; border-bottom: 3px solid var(--accent-2); color: var(--accent-2); text-align: center; }\n\n/* ---------- group ---------- */\n.group-code { display: flex; align-items: center; gap: 10px;\n  border-radius: 12px; padding: 14px 16px; font-size: 15px; color: var(--text-dim); margin-bottom: 16px; }\n.group-code b { font-size: 22px; letter-spacing: 3px; color: var(--accent-2); font-family: ui-monospace, monospace; }\n.group-code .copy { margin-left: auto; background: var(--bg-elevated); border: none; color: var(--text); border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }\n.member { display: flex; align-items: center; gap: 14px;\n  border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }\n.m-rank { font-size: 22px; width: 30px; text-align: center; flex: none; }\n.m-main { flex: 1; min-width: 0; }\n.m-name { font-weight: 800; font-size: 16px; }\n.m-name .you { font-size: 11px; background: var(--primary); color: #fff; padding: 2px 6px; border-radius: 6px; vertical-align: middle; }\n.m-stats { color: var(--text-dim); font-size: 13px; margin-top: 2px; }\n.m-skills { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }\n/* \u00a73 group readiness comparison */\n.m-tier { font-size: 11px; font-weight: 700; color: var(--text-dim); margin-left: 4px; }\n.m-readiness { font-family: var(--font-display); font-weight: 800; font-size: 22px; flex: none; }\n.m-readiness .pct { font-size: 13px; color: var(--text-dim); }\n.m-readiness.band-top { color: var(--green); } .m-readiness.band-good { color: var(--secondary); }\n.m-readiness.band-mid { color: var(--accent-2); } .m-readiness.band-low { color: var(--text-dim); }\n.m-readiness.stale { opacity: .45; }\n.pulse-strip { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 10px;\n  font-size: 13px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }\n.pulse-strip b { color: var(--text); }\n.skill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--bg-elevated); color: var(--text-dim); }\n.skill.good { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }\n.skill.bad { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }\n\n/* ---------- account ---------- */\n.backup-banner { background: var(--bg-card); border: 1px solid var(--accent-2); border-radius: var(--radius);\n  padding: 16px; margin: 16px 0 4px; font-size: 14px; line-height: 1.45; color: var(--text); }\n.backup-banner .btn { width: 100%; }\n.linkbtn { background: none; border: none; color: var(--secondary); font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px; width: 100%; }\n.time-input { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 16px; font-weight: 700; }\n\n/* ---------- countdown + plan ---------- */\n.countdown { margin: 6px 0 10px; font-size: 15px; color: var(--text-dim); font-weight: 700; }\n.countdown .cd-num { font-size: 30px; color: var(--accent-2); font-weight: 800; margin-right: 4px; }\n.countdown.here { color: var(--green); font-size: 17px; }\n.onb-card.plan { border-left: 4px solid var(--accent-2); }\n.plan-list { margin: 10px 0 4px; padding-left: 0; list-style: none; }\n.plan-list li { position: relative; padding: 6px 0 6px 26px; color: var(--text); line-height: 1.35; }\n.plan-list li::before { content: \"\u2713\"; position: absolute; left: 0; color: var(--green); font-weight: 800; }\n.trips-btn { margin-top: var(--space-3); }               /* uses .pill for the chip look */\n\n/* ---------- floating tab bar ---------- */\n#tabbar {\n  position: fixed; left: 50%; transform: translateX(-50%);\n  bottom: max(8px, calc(env(safe-area-inset-bottom) / 2));\n  width: calc(100% - 56px); max-width: 390px;\n  z-index: 40; display: none; align-items: stretch; justify-content: space-around;\n  background: var(--bg-nav); border: 1px solid var(--border); border-radius: 99px;\n  padding: 7px 8px; box-shadow: 0 8px 28px rgba(28,39,94,.18);\n  overflow: hidden;   /* the artifact clips the traveling light to the pill \u2014 without this it spills past the corners at outer tabs */\n}\n#tabbar.show { display: flex; }\n.tab {\n  background: none; border: none; cursor: pointer; color: var(--text-dim);\n  display: flex; flex-direction: column; align-items: center; gap: 2px;\n  padding: 7px 15px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: .2px;\n  transition: color .15s, background .15s;\n}\n.tab svg { width: 23px; height: 23px; }\n/* ONE light source (decisions 2026-07-17): the active tab's under-glow is the app's light, and it is a\n   single element that TRAVELS along the bar, never per-tab decoration that swaps. The screen atmosphere\n   (.bloom) is that same light scaled up, anchored to the active tab's x at the bottom edge. */\n.tab.active { color: var(--accent-2); position: relative; background: none; }\n.tab.active svg, .tab.active span { position: relative; }\n/* The light fills the bar's padding box (which already spans to just inside the border), so bottom:0 on the\n   notch lands ON the bar's bottom edge. The old per-tab pseudo-elements used negative offsets because they\n   were positioned against a TAB; against this full-height element they pushed the notch/glow below the bar. */\n.navlight { position: absolute; left: 0; top: 0; bottom: 0; width: 56px; pointer-events: none; z-index: 0;\n  transform: translateX(0); transition: transform 260ms cubic-bezier(.2,.7,.3,1); }\n.navlight .nl-glow { position: absolute; left: -10px; right: -10px; top: 0; bottom: 0;\n  background: radial-gradient(72% 100% at 50% 106%, color-mix(in srgb, var(--accent) 32%, transparent) 0%, color-mix(in srgb, var(--accent) 12%, transparent) 44%, transparent 76%); }\n.navlight .nl-notch { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;\n  width: 22px; height: 2.5px; border-radius: 2px; background: var(--accent-2);\n  box-shadow: 0 0 7px 1px color-mix(in srgb, var(--accent) 55%, transparent); }\n/* the same light, scaled up: one oversized radial moved by transform (never background-position) */\n.bloom { position: fixed; left: 0; bottom: -620px; width: 1240px; height: 1240px; border-radius: 50%;\n  pointer-events: none; z-index: 0; transform: translateX(-620px);\n  transition: transform 300ms cubic-bezier(.2,.7,.3,1);\n  background: radial-gradient(closest-side, color-mix(in srgb, #c96a2b 22%, transparent) 0%, color-mix(in srgb, var(--accent) 12%, transparent) 34%, color-mix(in srgb, var(--accent) 5%, transparent) 58%, transparent 78%); }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .bloom {\n  background: radial-gradient(closest-side, rgba(201,106,43,0.30) 0%, rgba(230,198,42,0.11) 38%, rgba(230,198,42,0.04) 62%, rgba(0,0,0,0) 80%); } }\n:root[data-theme=\"dark\"] .bloom {\n  background: radial-gradient(closest-side, rgba(201,106,43,0.30) 0%, rgba(230,198,42,0.11) 38%, rgba(230,198,42,0.04) 62%, rgba(0,0,0,0) 80%); }\n/* the traveling light is a state transition, not ambient animation: reduced motion jumps it */\n@media (prefers-reduced-motion: reduce) { .navlight, .bloom { transition: none; } }\n#app { transition: opacity 180ms cubic-bezier(.2,.7,.3,1); }\n#app.tab-fade { opacity: 0; }\n.tab:active { transform: translateY(1px); }\n\n/* ---------- tab screens (quests / phrasebook / progress) ---------- */\n.tab-screen { padding-bottom: 104px; }\n.screen-head { margin-bottom: 14px; }\n.screen-head h2 { font-size: 26px; margin: 0; }\n.q-head { font-family: var(--font-display); font-weight: 800; font-size: 15px; margin: 22px 0 10px; }\n\n.quest { display: flex; align-items: center; gap: 14px; background: var(--bg-card); border: 1px solid var(--border);\n  border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px; }\n.quest.done { opacity: .72; }\n.q-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); flex: none;\n  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }\n.quest.done .q-check { background: var(--green); border-color: var(--green-dark); }\n.q-t { font-weight: 800; font-size: 15px; }\n.q-d { color: var(--text-dim); font-size: 12px; margin-top: 2px; }\n\n.pb-seg { display: flex; gap: 8px; margin: 12px 0 4px; }\n.pb-seg .pill.on { background: var(-- ome action region (\u00a78b): hero tile \u00b7 review row \u00b7 standing line ---- */\n/* \u00a73.2 action tile \u2014 \"fade\" style: navy block with the session photo bleeding in from the right.\n   Kicker (gold) replaces the old kind-coded background colors. */\n.hero-tile {\n  position: relative; overflow: hidden; display: block; width: 100%; text-align: left; cursor: pointer;\n  padding: 0; font-size: 16px;   /* zero the UA button defaults (1px/6px padding, 13.3px font) */\n  margin: 6px 0 10px; min-height: 125px; border-radius: var(--radius-lg);   /* +20% per the action stack: space, not volume */\n  background: var(--primary); color: #fff; border: none; box-shadow: var(--shadow);\n  transition: transform var(--transition), box-shadow var(--transition);\n}\n.hero-tile:active { transform: translateY(2px); box-shadow: var(--shadow-press); }\n.hero-tile .hero-img { position: absolute; top: 0; right: 0; bottom: 0; width: 58%; background-size: cover; background-position: center; }\n.hero-tile .hero-img::after { content: \"\"; position: absolute; inset: 0;\n  background: linear-gradient(90deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 55%, transparent) 38%, transparent 78%); }\n.hero-tile .hero-inner { position: relative; padding: 18px 16px; width: 66%; display: flex; flex-direction: column; gap: 11px; }\n.hero-k { font-family: var(--font-display); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0; }\n.hero-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }\n.hero-sub { font-size: 13px; color: rgba(255,255,255,.82); margin: 0; line-height: 1.45; }\n\n/* \u00a73.1 Progress: status tier + labeled trend blocks */\n.prog-tier { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }\n.pt-name { font-family: var(--font-display); font-weight: 800; font-size: 22px; }\n.pt-next { font-size: 13px;
